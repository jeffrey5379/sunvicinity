    <script type="x-shader/x-vertex" id="vertexshader">
      varying vec2 vUv;
      void main() {
      	vUv = uv;
      	gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
      }
    </script>

    <script type="x-shader/x-fragment" id="fragmentshader">
      uniform sampler2D baseTexture;
      uniform sampler2D bloomTexture;
      varying vec2 vUv;

      vec4 getTexture( sampler2D texelToLinearTexture ) {
      	return texture2D( texelToLinearTexture , vUv );
      }

      void main() {
      	gl_FragColor = ( getTexture( baseTexture ) + vec4( 1.0 ) * getTexture( bloomTexture ) );
      }
    </script>

    <script type="module">

      const FEEDBACK_MESSAGE = "Your feedback is always welcome: jeffrey3829@proton.me";

      const CONS_STAGE = "Looks like some constellations names are misplaced. Will you be able to find pairs of incorrectly named constellations? Click the constellations names which are out of place.";

        "Vega is the fifth-brightest star in the night sky and is only about a tenth of the age of the Sun.",

      ];
      const CLUSTERS_STAGE = "Looks like it's time to visit nearest star clusters. Move with WASD. Use mouse panning to correct the direction and the compas to navigate. Zoom in to see the compass.";
      const CLUSTERS_TO_VISIT = ["HYADES", "PLEIADES", "BEEHIVE", "IC 2391", "NGC 3532"];

      const CLUSTERS_INFO = [
        "The age of the Hyades is estimated to be about 625 million years. The core of the cluster, where stars are the most densely packed, has a radius of 8.8 light-years, and the cluster's tidal radius is 33 light-years.",
        "The cluster is dominated by hot blue luminous stars that have formed within the last 100 million years. Astronomers estimate that the cluster will survive for approximately another 250 million years, after which the clustering will be lost due to gravitational interactions with the galactic neighborhood.",
        "Age and proper motion of the Beehive Cluster coincide with those of the Hyades, suggesting they may share similar origins. Both clusters also contain red giants and white dwarfs, which represent later stages of stellar evolution, along with many main sequence stars.",

        "NGC 3532 is an open cluster in the constellation Carina. Its population of approximately 150 stars of 7th magnitude or fainter includes seven red giants and seven white dwarfs.",
      ];

      const EXPLORATORY_MODE = "Exploratory";
      const APPTYPE = {
        CONLINE: "CONLINE",
        CONLABEL: "CONLABEL",
        STAR: "STAR",
        CLUSTER_LABEL: "CLUSTER_LABEL",
        BLACK_HOLE: "BLACK_HOLE",
      };
      const ANIMATION = { RECENTER: "RECENTER", CONS_SWAP: "CONS_SWAP", CLUSTER_ONE: "CLUSTER_ONE", CLUSTER_TWO: "CLUSTER_TWO" };
      var scene, camera, controls, renderer;
      const SUN_DIAMETER = 1391400,
        DEFAULT_RADIUS = 0.005;
      var animation,
        animationSteps = 200,
        clusterAnimationSteps = 1500,
        cameraElevation = 10,
        tempInc = Math.PI / animationSteps;
      var clustTempInc = (2 * Math.PI) / clusterAnimationSteps,
        currentStep = 0,
        exposure = 6;
      var constellations = [],
        constellationLines = [],
        constellationNames = [],
        lines = [],
        spheres = [],
        clickableObjects = [],
        conLabelLines = [],
        clusterLabelLines = [],
        starPositions = [];
      var white = 0xffffff,
        turquoise = 0x1996af,
        gray = 0x505050,
        red = 0xff0000,
        orange = 0xcc6600,
        yellow = 0xffff00;
      var conGameActive = false,
        clustersStageActive = false,
        constBefore, chosenCon, pairCon, arrow, actualMessage,
        foundStar, activeStar, activeCluster, sun;
      var chosenConSteps = [],
        pairConSteps = [],
        starColours = [],
        starNames = [],
        clusters = [],
        densities = [];
      var cacheDistance = 240.0,
        lastCachePoint = new THREE.Vector3(),
        densityDistance = 500.0,
        lazyLoadDistance = 80.0,
        discoverDistance = 40.0;
      var prevUpdate = new THREE.Vector3(),
        starGeometry = new THREE.IcosahedronGeometry(1, 4);
      var progress = 0,
        SMOOTH_MESSAGE_TIMEOUT = 30,
        mouseDownX, mouseDownY;
      var xSteps = [],
        ySteps = [],
        zSteps = [],
        cameraXsteps = [],
        cameraYsteps = [],
        cameraZsteps = [],
        targetXsteps = [],
        targetYsteps = [],
        targetZsteps = [],
        cameraXstepsTwo = [],
        cameraZstepsTwo = [],
        mainFont;
      const delay = (millis) =>
        new Promise((resolve, reject) => {
          setTimeout((_) => resolve(), millis);
        });
      var params = {
        exposure: exposure,
        bloomStrength: 6,
        bloomThreshold: 0,
        bloomRadius: 1,
        Mode: "Free",
        showConstellations: false,
        showDensity: false,
        Info: "None",
        Search: "",
      };
      var darkMaterial = new THREE.MeshBasicMaterial({ color: "black" });
      var materials = {};
      renderer = new THREE.WebGLRenderer({ antialias: false });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ReinhardToneMapping;
      renderer.toneMappingExposure = exposure;
      renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
      document.body.appendChild(renderer.domElement);
      const state = document.getElementById("state");
      const info = document.getElementById("info");
      var tempMessage, oldText;
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 50000.0);
      camera.position.set(0, 0, 3);
      camera.lookAt(0, 0, 0);
      controls = new OrbitControls(camera, renderer.domElement);
      controls.minDistance = 0.2;
      controls.maxDistance = 50000.0;
      controls.enableKeys = false;
      controls.enablePan = false;
      controls.addEventListener("change", render);
      var renderScene = new RenderPass(scene, camera);
      var bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
      bloomPass.threshold = params.bloomThreshold;
      bloomPass.strength = params.bloomStrength;
      bloomPass.radius = params.bloomRadius;
      var composer = new EffectComposer(renderer);
      composer.renderToScreen = false;
      composer.addPass(renderScene);
      composer.addPass(bloomPass);
      var shaderPass = new ShaderPass(
        new THREE.ShaderMaterial({
          uniforms: {
            baseTexture: { value: null },
            bloomTexture: { value: composer.renderTarget2.texture },
          },
          vertexShader: document.getElementById("vertexshader").textContent,
          fragmentShader: document.getElementById("fragmentshader").textContent,
          defines: {},
        }),
        "baseTexture"
      );
      shaderPass.needsSwap = true;
      var finalComposer = new EffectComposer(renderer);
      finalComposer.addPass(renderScene);
      finalComposer.addPass(shaderPass);
      var raycaster = new THREE.Raycaster(),
        mouse = new THREE.Vector2();
      window.addEventListener("pointerup", onDocumentMouseUp, false);
      window.addEventListener("pointerdown", onDocumentMouseDown, false);
      window.addEventListener("mousemove", onSphereHover, false);
      document.addEventListener("keydown", function (event) {
        if (document.activeElement === searchEl) {
          return;
        }
        if (document.activeElement && (document.activeElement.id === "sa-input" || document.activeElement.id === "sa-api-input")) {
          return;
        }
        var dx, dy, dz;
        if ([87, 83, 65, 68].includes(event.keyCode)) {
          if (progress < 6 || animation != null) {
            return;
          }
          dx = (camera.position.x - controls.target.x) / 100.0;
          dy = (camera.position.y - controls.target.y) / 100.0;
          dz = (camera.position.z - controls.target.z) / 100.0;
          var multiply = Math.floor(0.8 / Math.max(Math.abs(dx), Math.abs(dy), Math.abs(dz)));
          if (multiply > 0) {
            dx *= multiply;
            dy *= multiply;
            dz *= multiply;
          }
          switch (event.keyCode) {
            case 87:
              dx = -dx;
              dy = -dy;
              dz = -dz;
              break;
            case 83:
              break;
            case 65:
              dy = 0.0;
              var temp = dx;
              dx = -dz;
              dz = temp;
              break;
            case 68:
              dy = 0.0;
              var temp = dx;
              dx = dz;
              dz = -temp;
              break;
          }
          StarAgent.setActiveStar(null);
          var move = new THREE.Vector3(dx, dy, dz);
          camera.position.add(move);
          controls.target.add(move);
          camera.lookAt(controls.target);
          if (prevUpdate.distanceTo(controls.target) > lazyLoadDistance / 4) {
            updateScene(controls.target, true);
            updateScene(controls.target, false);
            prevUpdate.copy(controls.target);
            clearScene();
          }
        }
      });
      
      function setupCustomDropdowns(gui) {
        var openDropdown = null;

        document.addEventListener('pointerdown', function(e) {
          if (openDropdown && !openDropdown.contains(e.target)) {
            openDropdown.remove();
            openDropdown = null;
          }
        });

        gui.controllersRecursive().forEach(function(controller) {
          if (!controller.$select) return;
          controller.$select.addEventListener('pointerdown', function(e) { e.stopPropagation(); });
          controller.$select.addEventListener('mousedown', function(e) {
            e.preventDefault();
            e.stopPropagation();
            if (openDropdown) {
              openDropdown.remove();
              openDropdown = null;
              return;
            }
            var cs = getComputedStyle(gui.domElement);
            var rect = controller.$widget.getBoundingClientRect();
            openDropdown = document.createElement('div');
            openDropdown.style.cssText =
              'position:fixed;z-index:10000;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.5);' +
              'left:' + rect.left + 'px;top:' + rect.bottom + 'px;width:' + rect.width + 'px;' +
              'background:' + cs.getPropertyValue('--widget-color').trim() + ';' +
              'border-radius:' + cs.getPropertyValue('--widget-border-radius').trim() + ';' +
              'font-family:' + cs.getPropertyValue('--font-family').trim() + ';' +
              'font-size:' + cs.getPropertyValue('--font-size').trim() + ';' +
              'color:' + cs.getPropertyValue('--text-color').trim() + ';';
            Array.from(controller.$select.options).forEach(function(opt) {
              var item = document.createElement('div');
              item.textContent = opt.text;
              var isSelected = opt.value === controller.$select.value;
              var bgNormal = isSelected
                ? cs.getPropertyValue('--focus-color').trim()
                : cs.getPropertyValue('--widget-color').trim();
              item.style.cssText =
                'padding:0 .55em;cursor:pointer;' +
                'height:' + cs.getPropertyValue('--widget-height').trim() + ';' +
                'line-height:' + cs.getPropertyValue('--widget-height').trim() + ';' +
                'background:' + bgNormal + ';';
              item.addEventListener('mouseenter', function() {
                item.style.background = cs.getPropertyValue('--hover-color').trim();
              });
              item.addEventListener('mouseleave', function() {
                item.style.background = bgNormal;
              });
              item.addEventListener('pointerdown', function(e) {
                e.stopPropagation();
                controller.setValue(opt.value);
                openDropdown.remove();
                openDropdown = null;
              });
              openDropdown.appendChild(item);
            });
            document.body.appendChild(openDropdown);
          });
        });
      }

      var gui = new GUI({ width: 300 });
      gui.add(params, "Mode", ["Free", "Exploratory"])
        .onChange(function (value) {
          switch (value) {
            case "Free":
              showMessage(WELCOME_MESSAGE);
              break;
            case "Exploratory":
              if (progress < 6) {
                conGameActive = true;
              }
              showInfo(true);
              break;
          }
        });
      var showConstCtrl = gui.add(params, "showConstellations")
        .name("Show constellations")
        .onChange(function (value) {
          showConstellations(value);
        });
      var showDensityCtrl = gui.add(params, "showDensity")
        .name("Show density")
        .onChange(function (value) {
          showDensity(value);
        });
      
      function showDensity(value) {
        params.showDensity = value;
        for (var density of densities) {
          if (value && density.position.distanceTo(controls.target) < densityDistance) {
            scene.add(density);
          }
          if (!value) {
            scene.remove(density);
          }
        }
      }
      
      function showConstellations(value) {
        params.showConstellations = value;
        for (let line of lines) {
          line.visible = value;
        }
        for (let name of constellationNames) {
          name.visible = value;
        }
      }
      
      function consLeft() {
        return constellationNames.filter((name) => name.conGroup != null).length;
      }
      
      var goToSun = {
        goToSun: function () {
          if (controls.position != sun.position) {
            StarAgent.setActiveStar(sun.name);
            recenter(sun);
          }
        },
      };
      gui.add(goToSun, "goToSun").name("Go to Sun");
      var searchCtrl = gui.add(params, "Search").onFinishChange(function (value) {
        var star = starPositions.find((star) => star.name == value);
        if (star == null) {
          var name = starNames.find((obj) => obj.name == value);
          if (name != null) {
            star = starPositions.find((obj) => obj.name == name.code);
          }
        }
        if (star != null) {
          foundStar = star.name;
          StarAgent.setActiveStar(star.name);
          recenter(star);
        } else {
          showMessage("Nothing found", 3000);
        }
        this.setValue("");
      });
      gui.add(params, "Info", ["None", "About", "Feedback"])
        .onChange(function (value) {
          switch (value) {
            case "None":
              if (params.Mode == EXPLORATORY_MODE) {
                showInfo();
              } else {
                showMessage(WELCOME_MESSAGE);
              }
              break;
            case "About":
              showMessage(ABOUT_MESSAGE);
              break;
            case "Feedback":
              showMessage(FEEDBACK_MESSAGE);
              break;
          }
        });
      setupCustomDropdowns(gui);
      var searchEl = searchCtrl.$input;
      showConstCtrl.domElement.classList.add("hidden");
      showDensityCtrl.domElement.classList.add("hidden");
      searchCtrl.domElement.classList.add("hidden");
      mainFont = await new FontLoader().loadAsync("urbanist_bold.json");
      await readColours();
      await readNames();
      await readClusters();
      await setupScene();
      createNebula(scene, starPositions);
      StarAgent.init({ scene: scene, camera: camera, controls: controls, stars: starPositions, names: starNames });
      StarAgent.setNavigator(function(simbadId) {
        var star = starPositions.find(function(s) { return s.name === simbadId; });
        if (!star) return false;
        foundStar = star.name;
        recenter(star);
        return true;
      });
      naj();
      
      function naj() {
        setTimeout(function () {
          requestAnimationFrame(naj);
        }, 15);
        render();
      }
      
      function getColorBySpectralType(spectralType) {
        for (let colour of starColours) {
          for (let type of colour["types"]) {
            if (spectralType.startsWith(type)) {
              return colour["rgb"];
            }
          }
        }
        console.warn("Cannot determine colour for spectral type: " + spectralType);
        return [0.0, 0.9, 0.0];
      }
      
      function readColours() {
        fetch("./files/stars_classes.txt")
          .then((res) => res.text())
          .then((text) => {
            for (let colour of text.split("\n")) {
              var data = colour.split("|"),
                types = data[0].split(" "),
                rgb = data[1].split(" "),
                obj = {};
              obj["types"] = types;
              obj["rgb"] = rgb;
              starColours.push(obj);
            }
          })
          .catch((e) => console.error(e));
      }
      
      function readNames() {
        fetch("./files/stars_names.txt")
          .then((res) => res.text())
          .then((text) => {
            for (let line of text.split("\n")) {
              var data = line.split("|"),
                obj = {};
              obj.code = data[0];
              obj.name = data[1];
              starNames.push(obj);
            }
          })
          .catch((e) => console.error(e));
      }
      
      function readClusters() {
        fetch("./files/clusters.txt")
          .then((res) => res.text())
          .then((text) => {
            for (let line of text.split("\n")) {
              var data = line.split("|"),
                coord = data[1].split(" "),
                distance = data[2],
                center = data[3].split(" "),
                clusterLabel = createLabel(data[0], 1.0, controls.target);
              clusterLabel.position.setFromSphericalCoords(distance, coord[0], coord[1]);
              clusterLabel.apptype = APPTYPE.CLUSTER_LABEL;
              clusterLabel.name = data[0];
              clusterLabel.center = new THREE.Vector3();
              clusterLabel.center.setFromSphericalCoords(distance, center[0], center[1]);
              var lookAt = new THREE.Vector3();
              lookAt.y = clusterLabel.position.y;
              clusterLabel.lookAt(lookAt);
              clusterLabelLines.push(...clusterLabel.children);
              clusters.push(clusterLabel);
            }
          })
          .catch((e) => console.error(e));
      }
      
      function onSphereHover(event) {
        event.preventDefault();
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        var intersects = raycaster.intersectObjects(clickableObjects);
        if (intersects.length === 0) {
          var nearest = findNearestStarByScreenPos(mouse, 3);
          if (nearest) intersects = [{ object: nearest}];
        }
        if (intersects.length > 0 && !animation && intersects[0].object.text != undefined) {
          var object = intersects[0].object;
          if (object != activeStar) {
            showState(object.name);
          }
        } else {
          showState("");
        }
      }
      
      function showInfo(smooth) {
        if (params.Mode == "Free") {
          if (smooth) {
            showSmoothMessage(WELCOME_MESSAGE);
          } else {
            showMessage(WELCOME_MESSAGE);
          }
        } else {
          switch (progress) {
            case 0:
              if (smooth) {
                showSmoothMessage(CONS_STAGE + "(" + consLeft() + "/10 left)");
              } else {
                showMessage(CONS_STAGE + "(" + consLeft() + "/10 left)");
              }
              recenter(sun);
              showConstellations(true);
              break;
            case 1:
            case 2:
            case 3:
            case 4:
            case 5:
              showMessage(STARS_STAGE + STARS_INSTRUCTIONS[progress - 1]);
              break;
            case 6:
              showArrow(true);
            case 7:
            case 8:
            case 9:
            case 10:
              clustersStageActive = true;
              showMessage(CLUSTERS_STAGE + CLUSTERS_INSTRUCTIONS[progress - 6]);
              break;
            case 11:
              showArrow(false);
              clustersStageActive = false;
              searchCtrl.domElement.classList.remove("hidden");
              showDensityCtrl.domElement.classList.remove("hidden");
              showSmoothMessage(MODE_COMPLETED);
          }
        }
      }
      
      function showArrow(show) {
        if (show) {
          var arrowGroup = new THREE.Group();

          var mat = new THREE.MeshPhongMaterial({
            color: turquoise,
            specular: 0x333333,
            shininess: 0,
            emissive: 0x000000,
          });

          var shaftGeom = new THREE.CylinderGeometry(0.018, 0.018, 0.20, 24);
          shaftGeom.rotateX(Math.PI / 2);
          shaftGeom.translate(0, 0, -0.065);
          arrowGroup.add(new THREE.Mesh(shaftGeom, mat));

          var collarGeom = new THREE.CylinderGeometry(0.028, 0.028, 0.018, 24);
          collarGeom.rotateX(Math.PI / 2);
          collarGeom.translate(0, 0, 0.028);
          arrowGroup.add(new THREE.Mesh(collarGeom, mat));

          var headGeom = new THREE.CylinderGeometry(0, 0.075, 0.145, 24);
          headGeom.rotateX(Math.PI / 2);
          headGeom.translate(0, 0, 0.110);
          arrowGroup.add(new THREE.Mesh(headGeom, mat));

          var kl = new THREE.PointLight(0xffffff, 1.6, 1.6);
          kl.position.set(0.4, 0.5, 0.4);
          arrowGroup.add(kl);

          var fl = new THREE.PointLight(0xaaddff, 0.7, 1.6);
          fl.position.set(-0.45, 0.2, 0.35);
          arrowGroup.add(fl);

          var rl = new THREE.PointLight(0x33bbdd, 0.9, 1.0);
          rl.position.set(0.0, -0.4, -0.3);
          arrowGroup.add(rl);

          // 20% larger overall, flattened 65% in vertical (Y) plane
          arrowGroup.scale.set(1.2, 0.35, 1.2);

          arrow = arrowGroup;
          updateArrowHud();
          arrow.lookAt(clusters[progress - 6].center);
          scene.add(arrow);
        } else {
          scene.remove(arrow);
          arrow = undefined;
        }
      }

      function updateArrowHud() {
        if (arrow == undefined || !scene.children.includes(arrow)) return;
        var zDist = 3.0;
        var halfH = Math.tan(camera.fov * Math.PI / 360) * zDist;
        var halfW = halfH * (window.innerWidth / window.innerHeight);
        var ndcX = (28 / window.innerWidth) * 2 - 1;
        var offset = new THREE.Vector3(ndcX * halfW + 0.23, 0.6, -zDist);
        offset.applyQuaternion(camera.quaternion);
        arrow.position.copy(camera.position).add(offset);
      }

      function findNearestStarByScreenPos(mouseNDC, pixelRadius) {
        var _pos = new THREE.Vector3();
        var nearest = null;
        var minDistSq = pixelRadius * pixelRadius;
        for (var i = 0; i < clickableObjects.length; i++) {
          _pos.copy(clickableObjects[i].position).project(camera);
          if (_pos.z >= 1) continue;
          var dx = (_pos.x - mouseNDC.x) * window.innerWidth * 0.5;
          var dy = (_pos.y - mouseNDC.y) * window.innerHeight * 0.5;
          var distSq = dx * dx + dy * dy;
          if (distSq < minDistSq) {
            minDistSq = distSq;
            nearest = clickableObjects[i];
          }
        }
        return nearest;
      }

      function onDocumentMouseDown(event) {
        mouseDownX = event.clientX;
        mouseDownY = event.clientY;
        showState("");
      }

      async function onDocumentMouseUp(event) {
        if (!searchEl.contains(event.target)) {
          searchEl.blur();
        }
        event.preventDefault();
        var object;
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        if (Math.abs(mouseDownX - event.clientX) > 5 || Math.abs(mouseDownY - event.clientY) > 5) return;
        
        raycaster.setFromCamera(mouse, camera);
        var intersects = raycaster.intersectObjects(clickableObjects);
        if (intersects.length === 0) {
          var nearest = findNearestStarByScreenPos(mouse, 3);
          if (nearest) intersects = [{ object: nearest}];
        }
        if (intersects.length > 1 && intersects[0].object.position.distanceTo(camera.position) < 0.1) {
          object = intersects[1].object;
        }
        if (conGameActive && intersects.length == 0) {
          intersects = raycaster.intersectObjects(conLabelLines);
        }
        if (clustersStageActive && intersects.length == 0) {
          intersects = raycaster.intersectObjects(clusterLabelLines);
        }
        if (intersects.length > 0 && animation == null &&
          (intersects[0].object.apptype != undefined || intersects[0].object.parent.apptype != undefined)) {
          if (object == undefined) {
            object = intersects[0].object;
          }
          currentStep = 0;
          if (object.type === "Line" && object.parent.apptype == APPTYPE.CONLABEL && conGameActive) {
            object.material.color.setHex(turquoise);
            if (chosenCon == null) {
              chosenCon = object.parent;
            } else {
              pairCon = object.parent;
              await delay(1000);
              if (pairCon == chosenCon) {
                return;
              }
              if (pairCon.conGroup != null && pairCon.conGroup == chosenCon.conGroup) {
                showMessage(CONS_HIT);
                var centerX = (pairCon.position.x + chosenCon.position.x) / 2,
                  centerY = (pairCon.position.y + chosenCon.position.y) / 2,
                  centerZ = (pairCon.position.z + chosenCon.position.z) / 2;
                const firstCurve = new THREE.QuadraticBezierCurve3(
                  pairCon.position,
                  new THREE.Vector3(
                    (3 * centerX) / 4,
                    (5 * centerY) / 4,
                    (3 * centerZ) / 4
                  ),
                  chosenCon.position
                );
                chosenConSteps = firstCurve.getPoints(animationSteps);
                const secondCurve = new THREE.QuadraticBezierCurve3(
                  pairCon.position,
                  new THREE.Vector3(
                    (5 * centerX) / 4,
                    (3 * centerY) / 4,
                    (5 * centerZ) / 4
                  ),
                  chosenCon.position
                );
                pairConSteps = secondCurve.getPoints(animationSteps);
                animation = ANIMATION.CONS_SWAP;
              } else {
                if (pairCon.conGroup != null || chosenCon.conGroup != null) {
                  showMessage(CONS_PART_MISS, 5000);
                } else {
                  showMessage(CONS_MISS, 5000);
                }
                chosenCon.children[0].material.color.setHex(white);
                pairCon.children[0].material.color.setHex(white);
                chosenCon = undefined;
                pairCon = undefined;
              }
            }
            return;
          }
          if (object.type === "Line" && object.parent.apptype == APPTYPE.CLUSTER_LABEL && clustersStageActive) {
            if (
              object.parent.visited ||
              camera.position.distanceTo(object.parent.position) > discoverDistance
            ) {
              return;
            }
            if (object.parent.name != CLUSTERS_TO_VISIT[progress - 6]) {
              return;
            }
            constBefore = params.showConstellations;
            showConstellations(false);
            animation = ANIMATION.CLUSTER_ONE;
            controls.enabled = false;
            showArrow(false);
            object.material.color.setHex(turquoise);
            intersects = intersects.filter((line) => line.object.parent.apptype == APPTYPE.CLUSTER_LABEL);
            activeCluster = intersects[0].object.parent;
            var newTargetPosition = activeCluster.center;
            activeCluster.visited = true;
            var newCameraPosition = new THREE.Vector3();
            newCameraPosition.copy(newTargetPosition);
            var max = Math.max(Math.abs(newCameraPosition.x), Math.abs(newCameraPosition.z));
            var multiply = (max - 30) / max;
            newCameraPosition.x *= multiply;
            newCameraPosition.y += cameraElevation;
            newCameraPosition.z *= multiply;
          
            var tempX = 0.0;
            for (let i = 0; i < animationSteps; i++) {
              cameraXsteps[i] = (Math.PI * (newCameraPosition.x - camera.position.x) * Math.sin(tempX)) / (2 * animationSteps);
              cameraYsteps[i] = (Math.PI * (newCameraPosition.y - camera.position.y) * Math.sin(tempX)) / (2 * animationSteps);
              cameraZsteps[i] = (Math.PI * (newCameraPosition.z - camera.position.z) * Math.sin(tempX)) / (2 * animationSteps);
              targetXsteps[i] = (Math.PI * (newTargetPosition.x - controls.target.x) * Math.sin(tempX)) / (2 * animationSteps);
              targetYsteps[i] = (Math.PI * (newTargetPosition.y - controls.target.y) * Math.sin(tempX)) / (2 * animationSteps);
              targetZsteps[i] = (Math.PI * (newTargetPosition.z - controls.target.z) * Math.sin(tempX)) / (2 * animationSteps);
              tempX = tempX + tempInc;
            }
            var tempVar = new THREE.Vector3();
            tempVar.copy(newCameraPosition);
            tempVar.y -= cameraElevation;
            var rotationRadius = tempVar.distanceTo(newTargetPosition);
            tempX = Math.atan(newTargetPosition.x / newTargetPosition.z) + Math.PI / 2;
            for (let i = 0; i < clusterAnimationSteps; i++) {
              cameraXstepsTwo[i] = Math.sign(newTargetPosition.z) * Math.sign(newTargetPosition.x) * rotationRadius * Math.cos(tempX);
              cameraZstepsTwo[i] = -Math.sign(newTargetPosition.z) * rotationRadius * Math.sin(tempX);
              tempX = tempX - clustTempInc;
            }
            return;
          }
          StarAgent.setActiveStar(object.name);
          recenter(object);
          render();
        }
      }

      window.onresize = function () {
        var width = window.innerWidth,
          height = window.innerHeight;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
        composer.setSize(width, height);
        finalComposer.setSize(width, height);
        render();
      };
      
      function recenter(object) {
        animation = ANIMATION.RECENTER;
        if (activeStar != undefined) {
          showLabel(activeStar, false);
        }
        updateScene(object.position, true);
        var tempX = 0.0;
        for (let i = 0; i < animationSteps; i++) {
          xSteps[i] = (Math.PI * (object.position.x - controls.target.x) * Math.sin(tempX)) / (2 * animationSteps);
          ySteps[i] = (Math.PI * (object.position.y - controls.target.y) * Math.sin(tempX)) / (2 * animationSteps);
          zSteps[i] = (Math.PI * (object.position.z - controls.target.z) * Math.sin(tempX)) / (2 * animationSteps);
          tempX = tempX + tempInc;
        }
        if (camera.position.distanceTo(object.position) > 0.1 && object.text != undefined) {
          showLabel(object, true);
        }
        if (object.apptype == APPTYPE.STAR) {
          activeStar = object;
        }
      }
      
      async function setupScene() {
        scene.traverse(disposeMaterial);
        scene.children.length = 0;
        const constellationLineMaterial = new THREE.LineBasicMaterial({ color: gray });
        readConstellationData();
        var urls = [];
        for (var i = 1; i <= 12; i++) {
          urls.push("./files/star_data" + i + ".txt");
        }
        const requests = urls.map((url) => fetch(url));
        await Promise.all(requests)
          .then((responses) => {
            const text = responses.map((res) => res.text());
            return Promise.all(text);
          })
          .then((data) => {
            var allText = data.reduce((txt1, txt2) => {
              return txt1 + txt2;
            });
            var stars = allText.split("\n"),
              sunPosition = new THREE.Vector3();
            for (let star of stars) {
              var position = {};
              position.name = star.split("|")[0];
              position.data = star;
              position.position = createPosition(star);
              starPositions.push(position);
              if (position.position.distanceTo(sunPosition) < cacheDistance || constellationStar(position.name)) {
                var sphere = createStar(star);
                for (let line of constellations) {
                  for (let star of line) {
                    if (star.name === sphere.name) {
                      star.position = sphere.position;
                    }
                  }
                }
                spheres.push(sphere);
                if (lazyLoadDistance > controls.target.distanceTo(sphere.position)) {
                  scene.add(sphere);
                  clickableObjects.push(sphere);
                }
              }
            }
            for (let data of constellations) {
              const constellationPoints = [];
              for (let star of data) {
                if (star.position.x === undefined) {
                  console.warn(star.name + " data is missing");
                }
                constellationPoints.push(star.position);
              }
              constellationLines.push(constellationPoints);
              var lineGeometry = new THREE.BufferGeometry().setFromPoints(constellationPoints);
              var line = new THREE.Line(lineGeometry, constellationLineMaterial);
              line.visible = false;
              line.shine = false;
              line.apptype = APPTYPE.CONLINE;
              lines.push(line);
              scene.add(line);
            }
            showLabel(activeStar, true);
            StarVisuals.init({ scene: scene, camera: camera, controls: controls, stars: spheres });
          })
          .catch((e) => console.error(e));
        showInfo(true);
        initDensities();
        showGalaxyCenter();
        render();
      }
      
      function initDensities() {
        var cellSize = 100.0,
          bound = 2000.0,
          matrix = new Array(40);
        for (let i = 0; i < 40; i++) {
          matrix[i] = new Array(40);
          for (let j = 0; j < 40; j++) {
            matrix[i][j] = new Array(40).fill(0);
          }
        }
        for (var star of starPositions) {
          if (star.position.distanceTo(sun.position) < bound) {
            var x = Math.floor(star.position.x / cellSize) + 20;
            var y = Math.floor(star.position.y / cellSize) + 20;
            var z = Math.floor(star.position.z / cellSize) + 20;
            matrix[x][y][z] += 1;
          }
        }
        for (let i = 0; i < 40; i++) {
          for (let j = 0; j < 40; j++) {
            for (let k = 0; k < 40; k++) {
              var position = new THREE.Vector3();
              position.x = (i - 20) * cellSize + cellSize / 2;
              position.y = (j - 20) * cellSize + cellSize / 2;
              position.z = (k - 20) * cellSize + cellSize / 2;
              var clr = matrix[i][j][k] > 2000 ? red
                                      : matrix[i][j][k] > 1500 ? orange 
                                                  : matrix[i][j][k] > 1000 ? yellow : white;
              if (matrix[i][j][k] != 0) {
                var label = createLabel(matrix[i][j][k] + "", 4.0, position, clr);
                densities.push(label);
              }
            }
          }
        }
      }
      
      function showGalaxyCenter() {
        var sagAMaterial = new THREE.MeshBasicMaterial({ color: 0x100500 });
        var sagA = new THREE.Mesh(starGeometry, sagAMaterial);
        sagA.position.setFromSphericalCoords(26000, 2.07, 4.64);
        sagA.scale.setScalar(50.0);
        sagA.name = "Sagittarius A*";
        sagA.apptype = APPTYPE.BLACK_HOLE;
        scene.add(sagA);
      }
      
      function constellationStar(starName) {
        for (let line of constellations) {
          for (let star of line) {
            if (star.name === starName) {
              return true;
            }
          }
        }
        return false;
      }
      
      function createPosition(star) {
        var params = star.split("|"),
          ly = plxToLy(params[3]),
          coord = params[2].split(" ");
        return new THREE.Vector3().setFromSphericalCoords(ly, Math.PI / 2 - degreesToRad(coord[1]), degreesToRad(coord[0]));
      }
      
      function createStar(star) {
        var params = star.split("|"),
          color = new THREE.Color(),
          name = params[0],
          spectralType = params[4];
        color.setHex(getColorBySpectralType(spectralType));
        var material = new THREE.MeshBasicMaterial({ color: color }),
          sphere = new THREE.Mesh(starGeometry, material),
          ly = plxToLy(params[3]);
        if (params[0] === "Sun") {
          ly = 0.0;
          sun = sphere;
          activeStar = sphere;
        }
        var coord = params[2].split(" "),
          fi = degreesToRad(coord[0]),
          theta = degreesToRad(coord[1]);
        sphere.position.setFromSphericalCoords(ly, Math.PI / 2 - theta, fi);
        sphere.name = name;
        var secondName = starNames.find((star) => star.code == name);
        if (secondName != null) {
          sphere.secondName = secondName.name;
        }
        var size = params[5];
        if (size !== undefined && size.length != 0) {
          if (size.endsWith("km")) {
            size = Number(size.split(" ")[0] / SUN_DIAMETER);
          } else if (size.endsWith("mas")) {
            size = Number(size.split(" ")[0]);
          } else {
            size = "NA";
          }
        } else {
          size = "NA";
        }
        if (size == "NA") {
          sphere.scale.setScalar(DEFAULT_RADIUS);
        } else {
          sphere.scale.setScalar(DEFAULT_RADIUS * Math.pow(size, 0.25));
        }
        sphere.shine = true;
        sphere.apptype = APPTYPE.STAR;
        sphere.initialscale = sphere.scale.x;
        sphere.spectralClass = spectralType ? (spectralType.match(/[OBAFGKMLTYXWDC]/) || [""])[0] : "";
        sphere.spectralType  = spectralType || "";
        sphere.text = ly.toFixed(0) + " ly. Type " + params[1] + " Class " + spectralType + 
          (typeof size == "number" && size.toFixed(0) > 1 ? ". " + size.toFixed(0) + " Sun radii" : "");
        if (sphere == sun) {
          sphere.text = "Class " + spectralType;
        }
        return sphere;
      }
      
      async function showSmoothMessage(message) {
        actualMessage = message;
        for (var i = 0; i <= message.length; i++) {
          info.innerText = message.substring(0, i);
          await delay(SMOOTH_MESSAGE_TIMEOUT);
          if (message != actualMessage) {
            break;
          }
        }
      }
      
      async function showMessage(message, timeout) {
        if (!tempMessage) {
          oldText = info.innerText;
        }
        info.innerText = message;
        if (timeout) {
          tempMessage = true;
          await delay(timeout);
          info.innerText = oldText;
          tempMessage = false;
        }
      }
      
      function showState(message) {
        state.innerText = message;
      }
      
      function showLabel(sphere, show) {
        if (!show) {
          scene.remove(sphere.labelPrimary);
          scene.remove(sphere.labelSecondary);
        } else {
          if (sphere.apptype != APPTYPE.BLACK_HOLE) {
            var position = new THREE.Vector3(
              sphere.position.x + 3 * sphere.initialscale,
              sphere.position.y,
              sphere.position.z
            );
            var name = sphere.secondName != undefined
                ? sphere.secondName + " (" + sphere.name + ")"
                : sphere.name;
            sphere.labelPrimary = createLabel(name, 0.02, position);
            scene.add(sphere.labelPrimary);
            position.y -= 0.015;
            sphere.labelSecondary = createLabel(sphere.text, 0.005, position);
            scene.add(sphere.labelSecondary);
          }
        }
      }
      
      function createLabel(message, size, position, color) {
        var matColor = color == undefined ? white : color;
        var labelMat = new THREE.LineBasicMaterial({
          color: matColor,
          side: THREE.DoubleSide,
        });
        var shapes = mainFont.generateShapes(message, size);
        var holeShapes = [];
        for (var i = 0; i < shapes.length; i++) {
          var shape = shapes[i];
          if (shape.holes && shape.holes.length > 0) {
            for (var j = 0; j < shape.holes.length; j++) {
              var hole = shape.holes[j];
              holeShapes.push(hole);
            }
          }
        }
        shapes.push.apply(shapes, holeShapes);
        var label = new THREE.Object3D();
        for (var i = 0; i < shapes.length; i++) {
          label.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(shapes[i].getPoints()), labelMat));
        }
        label.position.copy(position);
        return label;
      }
      
      function readConstellationData() {
        fetch("./files/cons_lines.txt")
          .then((res) => res.text())
          .then((text) => {
            for (let line of text.split("\n")) {
              var listOfStars = [];
              for (let star of line.split("|")) {
                var obj = {};
                obj.name = star;
                obj.position = {};
                listOfStars.push(obj);
              }
              constellations.push(listOfStars);
            }
          })
          .catch((e) => console.error(e));
        fetch("./files/constellations.txt")
          .then((res) => res.text())
          .then((text) => {
            var groups = [];
            for (let line of text.split("\n")) {
              var data = line.split("|");
              var coord = data[1].split(" "),
                conLabel = createLabel(data[0], 0.4, controls.target);
              conLabel.position.setFromSphericalCoords(30, coord[0], coord[1]);
              conLabel.visible = false;
              conLabel.apptype = APPTYPE.CONLABEL;
              conLabel.conGroup = data[2];
              conLabel.conName = data[0];
              conLabel.lookAt(controls.target);
              if (conLabel.conGroup) {
                groups.push(conLabel);
              }
              conLabelLines.push(...conLabel.children);
              constellationNames.push(conLabel);
              scene.add(conLabel);
            }
            while (groups.length > 0) {
              var first = groups[0];
              for (let conLabel of groups) {
                if (first != conLabel && first.conGroup == conLabel.conGroup) {
                  swapConsOnInit(first, conLabel);
                  groups = groups.filter((label) => label.conGroup != first.conGroup);
                }
              }
            }
          })
          .catch((e) => console.error(e));
      }
      
      function swapConsOnInit(first, second) {
        var position = first.position.clone();
        first.position.copy(second.position);
        second.position.copy(position);
        first.lookAt(0.0, 0.0, 0.0);
        second.lookAt(0.0, 0.0, 0.0);
      }
      
      function plxToLy(plx) {
        return 3261.56 / plx;
      }
      
      function degreesToRad(degrees) {
        return (degrees * Math.PI) / 180.0;
      }
      
      function disposeMaterial(obj) {
        if (obj.material) {
          obj.material.dispose();
        }
      }
      
      function render() {
        StarVisuals.update();
        if (animation == ANIMATION.RECENTER) {
          var move = new THREE.Vector3(xSteps[currentStep], ySteps[currentStep], zSteps[currentStep]);
          currentStep++;
          camera.position.add(move);
          controls.target.add(move);
          camera.lookAt(controls.target);
          if (currentStep >= animationSteps) {
            animation = null;
            updateScene(activeStar.position, false);
            clearScene();
            currentStep = 0;
            if (params.Mode == EXPLORATORY_MODE && activeStar.name == STARS_TO_VISIT[progress - 1]) {
              showSmoothMessage("Well done! " + STARS_INFO[progress - 1]);
              var audio = new Audio("./files/paz.mp3");
              audio.volume = 0.5;
              audio.play();
              setTimeout(() => {
                progress++;
                showInfo();
              }, 15000);
            }
          }
        }
        if (animation == ANIMATION.CONS_SWAP) {
          chosenCon.position.copy(chosenConSteps[animationSteps - currentStep]);
          pairCon.position.copy(pairConSteps[currentStep]);
          currentStep++;
          chosenCon.lookAt(sun.position);
          pairCon.lookAt(sun.position);
          if (currentStep >= animationSteps) {
            animation = null;
            chosenCon.children[0].material.color.setHex(white);
            pairCon.children[0].material.color.setHex(white);
            pairCon.conGroup = null;
            chosenCon.conGroup = null;
            chosenCon = null;
            pairCon = null;
            var left = consLeft();
            if (left > 0) {
              showMessage(CONS_STAGE + "(" + left + "/10) left");
            } else {
              showMessage(CONS_COMPLETED);
              showConstCtrl.domElement.classList.remove("hidden");
              conGameActive = false;
              params.showConstellations = true;
              showConstCtrl.updateDisplay();
              showConstellations(true);
              progress++;
              setTimeout(() => {
                showInfo();
              }, 10000);
            }
          }
        }
        if (animation == ANIMATION.CLUSTER_ONE) {
          if (activeStar != undefined) {
            showLabel(activeStar, false);
          }
          
          var cameramove = new THREE.Vector3(cameraXsteps[currentStep], cameraYsteps[currentStep], cameraZsteps[currentStep]),
            targetmove = new THREE.Vector3(targetXsteps[currentStep], targetYsteps[currentStep], targetZsteps[currentStep]);
          currentStep++;
          camera.position.add(cameramove);
          controls.target.add(targetmove);
          camera.lookAt(controls.target);
          if (currentStep >= animationSteps) {
            animation = ANIMATION.CLUSTER_TWO;
            currentStep = 1;
            var audio = new Audio("./files/ekm.mp3");
            audio.volume = 0.5;
            audio.play();
            if (params.Mode == EXPLORATORY_MODE && activeCluster.name == CLUSTERS_TO_VISIT[progress - 6]) {
              showSmoothMessage("Well done! " + CLUSTERS_INFO[progress - 6]);
              setTimeout(() => {
                progress++;
                showInfo();
              }, 26000);
            }
          }
        }

        if (animation == ANIMATION.CLUSTER_TWO) {
          var cameramove = new THREE.Vector3(cameraXstepsTwo[currentStep] - cameraXstepsTwo[currentStep - 1], 0.0, cameraZstepsTwo[currentStep] - cameraZstepsTwo[currentStep - 1]);
          currentStep++;
          camera.position.add(cameramove);
          camera.lookAt(controls.target);
          if (currentStep >= clusterAnimationSteps) {
            setTimeout(() => {
              showArrow(true);
            }, 1000);
            
            controls.enabled = true;
            animation = null;
            currentStep = 0;
            showConstellations(constBefore);
          }
        }
        if (arrow != undefined && scene.children.includes(arrow) && clusters[progress - 6]) {
          updateArrowHud();
          arrow.lookAt(clusters[progress - 6].center);
        }
        updateNebula(camera);
        adjustStars();
        renderBloom();
        finalComposer.render();
      }

      function adjustStars() {
        for (var obj of scene.children) {
          if (obj.apptype == APPTYPE.STAR) {
            var distance = obj.position.distanceTo(camera.position);
            var red = obj.material.color.g == 0.0 && obj.material.color.b == 0.0;
            var k = Math.sqrt(2 * distance) / 2;
            if (distance > lazyLoadDistance && obj.initialscale != DEFAULT_RADIUS) {
              continue;
            }
            if ((k < 1 && k > 0.5) || (!red && k > 1)) {
              obj.scale.setScalar(k * obj.initialscale);
            }
          }
        }
      }
      
      function clearScene() {
        for (var sphere of scene.children.filter((obj) => obj.apptype == APPTYPE.STAR && !spheres.includes(obj))) {
          scene.remove(sphere);
        }
      }
      
      function recalculateCache(position) {
        spheres = [];
        clickableObjects = [];
        for (var star of starPositions) {
          if (star.position.distanceTo(position) < cacheDistance) {
            var sphere = createStar(star.data);
            spheres.push(sphere);
          }
        }
        lastCachePoint.copy(position);
        StarVisuals.rebuild(spheres);
      }
      
      function updateScene(position, show) {
        if (lastCachePoint.distanceTo(position) > cacheDistance / 2) {
          recalculateCache(position);
        }
        for (var sphere of spheres) {
          if (show && sphere.position.distanceTo(position) < lazyLoadDistance) {
            scene.add(sphere);
            if (!clickableObjects.includes(sphere)) clickableObjects.push(sphere);
            if (sphere.name == foundStar) {
              activeStar = sphere;
              showLabel(sphere, true);
              foundStar = undefined;
            }
          }
          if (!show && sphere.position.distanceTo(position) > lazyLoadDistance) {
            scene.remove(sphere);
            const idx = clickableObjects.indexOf(sphere);
            if (idx !== -1) clickableObjects.splice(idx, 1);
          }
        }
        
        for (var density of densities) {
          if (show && params.showDensity && density.position.distanceTo(position) < 500) {
            scene.add(density);
          }
          if (!show && density.position.distanceTo(position) > 500) {
            scene.remove(density);
          }
        }
        
        for (var cluster of clusters) {
          if (discoverDistance > position.distanceTo(cluster.position)) {
            scene.add(cluster);
          } else {
            scene.remove(cluster);
          }
        }
        console.log("Scene objects " + scene.children.length);
      }
      
      function renderBloom() {
        scene.traverse(darkenNonBloomed);
        composer.render();
        scene.traverse(restoreMaterial);
      }
      
      function darkenNonBloomed(obj) {
        if (!obj.shine) {
          materials[obj.uuid] = obj.material;
          obj.material = darkMaterial;
        }
      }
      
      function restoreMaterial(obj) {
        if (materials[obj.uuid]) {
          obj.material = materials[obj.uuid];
          delete materials[obj.uuid];
        }
      }
    </script>
  </body>
</html>
