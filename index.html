          return;

            return;

          var forward = offset.normalize();
          var right = new THREE.Vector3(-forward.z, 0, forward.x).normalize();
          var move = new THREE.Vector3();
          switch (event.keyCode) {
            case 87:
              move.copy(forward).multiplyScalar(-speed);
              break;
            case 83:
              move.copy(forward).multiplyScalar(speed);
              break;
            case 65:
              move.copy(right).multiplyScalar(speed);
              break;
            case 68:
              move.copy(right).multiplyScalar(-speed);
              break;

          StarAgent.setActiveStar(null);

              'font-size:' + cs.getPropertyValue('--font-size').trim() + ';' +
              'color:' + cs.getPropertyValue('--text-color').trim() + ';';

              var item = document.createElement('div');

              var isSelected = opt.value === controller.$select.value;
              var bgNormal = isSelected

      var densityMapGroup = null, densityMapRequest = null, preDensityMapChildren = null, preDensityMapClickable = null;
      var preDensityMapCameraFar = null;
      var densityMapMesh = null, hoveredDensityInstanceId = -1;
      var DENSITY_MODE_CAMERA_FAR = 500000.0;
      var DENSITY_ZOOM_OUT_LY = 5000.0, DENSITY_ZOOM_IN_LY = 5.0;
      var densityZoomStartDist = 0, densityZoomEndDist = 0, densityZoomDir = null, densityZoomOnComplete = null;
      var densityZoomStartTarget = new THREE.Vector3(), densityZoomEndTarget = new THREE.Vector3();
      function startDensityZoom(targetDistanceLy, onComplete, endTarget) {
        var offset = new THREE.Vector3().subVectors(camera.position, controls.target);
        densityZoomStartDist = offset.length();
        densityZoomDir = densityZoomStartDist > 1e-6 ? offset.normalize() : new THREE.Vector3(0, 0, 1);
        densityZoomEndDist = targetDistanceLy;
        densityZoomOnComplete = onComplete || null;
        densityZoomStartTarget.copy(controls.target);
        densityZoomEndTarget.copy(endTarget || controls.target);
        AnimationRunner.play(ANIMATION.DENSITY_ZOOM);
      }
      function tickDensityZoom() {
        var t = AnimationRunner.step / animationSteps;
        var ease = (1 - Math.cos(Math.PI * t)) / 2;
        var dist = densityZoomStartDist + (densityZoomEndDist - densityZoomStartDist) * ease;
        controls.target.copy(densityZoomStartTarget).lerp(densityZoomEndTarget, ease);
        camera.position.copy(controls.target).addScaledVector(densityZoomDir, dist);
        camera.lookAt(controls.target);
        if (AnimationRunner.step >= animationSteps) {
          AnimationRunner.stop();
          var onComplete = densityZoomOnComplete;
          densityZoomOnComplete = null;
          onComplete?.();
        }
      }

      function restoreSceneAfterDensityMode() {
        scene.remove(densityMapGroup);
        for (var child of preDensityMapChildren) scene.add(child);
        preDensityMapChildren = null;
        for (var obj of preDensityMapClickable) clickableObjects.push(obj);
        preDensityMapClickable = null;
        if (preDensityMapCameraFar != null) {
          camera.far = preDensityMapCameraFar;
          camera.updateProjectionMatrix();
          preDensityMapCameraFar = null;
        }
      }

      async function toggleDensityMap(value) {
        params.showDensity = value;
        if (!value) {
          densityBandsCtrl.style.display = "none";
          if (preDensityMapChildren) {
            if (hoveredDensityInstanceId !== -1) {
              clearDensityHighlight(densityMapMesh, hoveredDensityInstanceId);
              hoveredDensityInstanceId = -1;
            }
            startDensityZoom(DENSITY_ZOOM_IN_LY, restoreSceneAfterDensityMode);
          }
          return;
        }
        if (preDensityMapChildren) {
          densityZoomOnComplete = null;
          startDensityZoom(DENSITY_ZOOM_OUT_LY);
          return;
        }
        if (!densityMapRequest) {
          densityMapRequest = loadDensityGrid("./files/density-grid.bin")
            .then((grid) => {
              densityMapGroup = buildDensityMapGroup(grid);
              densityMapMesh = densityMapGroup.getObjectByName("densityCells");
            })
            .catch((e) => {
              console.error("density map load failed:", e);
              showMessage("Density map unavailable", 3000);
              params.showDensity = false;
              showDensityCtrl.updateDisplay();
            });
        }
        await densityMapRequest;
        if (!densityMapGroup || !params.showDensity || preDensityMapChildren) return;
        preDensityMapChildren = scene.children.filter((c) => c !== milkyWay);
        for (var child of preDensityMapChildren) scene.remove(child);
        preDensityMapClickable = clickableObjects.slice();
        clickableObjects.length = 0;
        preDensityMapCameraFar = camera.far;
        camera.far = DENSITY_MODE_CAMERA_FAR;
        camera.updateProjectionMatrix();
        applyDensityBands();
        densityBandsCtrl.style.display = "";
        scene.add(densityMapGroup);
        startDensityZoom(DENSITY_ZOOM_OUT_LY);
      }

      async function fetchNearestStar(x, y, z) {
        const params = "x=" + x + "&y=" + y + "&z=" + z;
        try {
          const [bufferRes, dictRes] = await Promise.all([
            fetch("/api/stars/nearest?" + params),
            fetch("/api/dictionaries/nearest?" + params),
          ]);
          if (bufferRes.status === 404 || dictRes.status === 404) return null;
          if (!bufferRes.ok || !dictRes.ok) {
            throw new Error("nearest-star request failed: " + bufferRes.status + "/" + dictRes.status);
          }
          const [buffer, dictionaries] = await Promise.all([bufferRes.arrayBuffer(), dictRes.json()]);
          const header = new Uint32Array(buffer, 0, 8);
          const nameOffsets = new Uint32Array(buffer, header[4], 2); // count is always 1 here
          const namesBlob = new Uint8Array(buffer, header[5], header[6]);
          const name = new TextDecoder().decode(namesBlob.subarray(nameOffsets[0], nameOffsets[1]));
          starCatalog.addBatch(buffer, dictionaries);
          return starCatalog.findByName(name);
        } catch (e) {
          console.error(e);
          return null;
        }
      }

      function flyToNearestStarAt(center) {
        if (!preDensityMapChildren) return; // not actually in density mode — ignore
        if (hoveredDensityInstanceId !== -1) {
          clearDensityHighlight(densityMapMesh, hoveredDensityInstanceId);
          hoveredDensityInstanceId = -1;
        }
        var starPromise = fetchNearestStar(center.x, center.y, center.z);
        params.showDensity = false;
        showDensityCtrl.updateDisplay();

        startDensityZoom(DENSITY_ZOOM_IN_LY, function () {
          restoreSceneAfterDensityMode();
          starPromise.then(function (star) {
            if (star) {
              // Snap the last few ly from "the cell center" to "the star's
              // exact position" — negligible next to the zoom distance
              // just traveled, but keeps controls.target exactly on the
              // star rather than merely near it.
              var toStar = new THREE.Vector3().subVectors(star.position, controls.target);
              controls.target.copy(star.position);
              camera.position.add(toStar);
              camera.lookAt(controls.target);
              StarAgent.setActiveStar(star.name);
              settleAtStar(star);
            } else {
              showMessage("No star found near that point", 3000);
            }
          });
        }, center);
      }

      async function searchStarOnServer(name) {
        const params = "name=" + encodeURIComponent(name);
        try {
          const [bufferRes, dictRes] = await Promise.all([
            fetch("/api/stars/search?" + params),
            fetch("/api/dictionaries/search?" + params),
          ]);
          if (bufferRes.status === 404 || dictRes.status === 404) return null;
          if (!bufferRes.ok || !dictRes.ok) {
            throw new Error("search request failed: " + bufferRes.status + "/" + dictRes.status);
          }
          const [buffer, dictionaries] = await Promise.all([bufferRes.arrayBuffer(), dictRes.json()]);
          starCatalog.addBatch(buffer, dictionaries);
          return starCatalog.findByName(name);
        } catch (e) {
          console.error(e);
          return null;
        }
      }

      async function runSearch(value) {
        var resolvedName = value;
        var star = starCatalog.findByName(value);
        if (star == null) {
          var name = starNames.find((obj) => obj.name == value);
          if (name != null) {
            resolvedName = name.code;
            star = starCatalog.findByName(resolvedName);
          }
        }
        if (star == null) {
          star = await searchStarOnServer(resolvedName);
        }
        if (star != null) {
          StarAgent.setActiveStar(star.name);
          recenter(star);
        } else {
          showMessage("Nothing found", 3000);
        }
        searchCtrl.setValue("");
      }

      var searchCtrl = gui.add(params, "Search");

      gui.add(params, "Info", ["None", "About", "Feedback"])
        .onChange(function (value) {
          switch (value) {
            case "None":
              if (params.Mode == EXPLORATORY_MODE) {
                showInfo();
              } else {
                showMessage(WELCOME_MESSAGE);
              }
              break;
            case "About":
              showMessage(ABOUT_MESSAGE);
              break;
            case "Feedback":
              showMessage(FEEDBACK_MESSAGE);
              break;
          }
        });
      setupCustomDropdowns(gui);
      var searchEl = searchCtrl.$input;
      searchEl.addEventListener("keydown", function (event) {
        if (event.key !== "Enter") {
          return;
        }
        var value = searchEl.value.trim();
        if (value === "") {
          return;
        }
        runSearch(value);
      });
      showConstCtrl.domElement.classList.add("hidden");
      showMinimapCtrl.domElement.classList.add("hidden");
      moveSpeedCtrl.domElement.classList.add("hidden");
      showDensityCtrl.domElement.classList.add("hidden");
      searchCtrl.domElement.classList.add("hidden");
      goToSagACtrl.domElement.classList.add("hidden");
      mainFont = await new FontLoader().loadAsync("urbanist_bold.json");
      await readColours();
      await readNames();
      await readClusters();
      await setupScene();
      createNebula(scene, starCatalog);
      milkyWay = buildMilkyWayGroup();
      scene.add(milkyWay);
      StarAgent.init({ controls: controls, stars: starCatalog, names: starNames, search: searchStarOnServer });
      StarAgent.setNavigator(function(simbadId) {
        var star = starCatalog.findByName(simbadId);
        if (!star) return false;
        recenter(star);
        return true;
      });
      let _lastFrameTime = 0;

      function limitFrames(time) {
        requestAnimationFrame(limitFrames);
        if (time - _lastFrameTime < 15) return;
        _lastFrameTime = time;
        render();
      }
      requestAnimationFrame(limitFrames);
      
      function getColorBySpectralType(spectralType) {
        for (let colour of starColours) {
          for (let type of colour["types"]) {
            if (spectralType.startsWith(type)) {
              return colour["rgb"];
            }
          }
        }
        console.warn("Cannot determine colour for spectral type: " + spectralType);
        return [0.9, 0.0, 0.0];
      }
      
      function readColours() {
        fetch("./files/stars_classes.txt")
          .then((res) => res.text())
          .then((text) => {
            for (let colour of text.split("\n")) {
              var data = colour.split("|"),
                types = data[0].split(" "),
                rgb = data[1].split(" "),
                obj = {};
              obj["types"] = types;
              obj["rgb"] = rgb;
              starColours.push(obj);
            }
          })
          .catch((e) => console.error(e));
      }
      
      function readNames() {
        fetch("./files/stars_names.txt")
          .then((res) => res.text())
          .then((text) => {
            for (let line of text.split("\n")) {
              var data = line.split("|"),
                obj = {};
              obj.code = data[0];
              obj.name = data[1];
              starNames.push(obj);
            }
          })
          .catch((e) => console.error(e));
      }
      
      function readClusters() {
        fetch("./files/clusters.txt")
          .then((res) => res.text())
          .then((text) => {
            for (let line of text.split("\n")) {
              if (!line.trim()) continue;
              var data = line.split("|"),
                coord = data[1].split(" "),
                distance = parseFloat(data[2]),
                clusterLabel = createLabel(data[0], 1.0, controls.target);
              clusterLabel.position.setFromSphericalCoords(distance, coord[0], coord[1]);
              clusterLabel.apptype = APPTYPE.CLUSTER_LABEL;
              clusterLabel.name = data[0];
              clusterLabel.distance = distance;
              clusterLabel.info = (data[3] || "").trim();
              var lookAt = new THREE.Vector3();
              lookAt.y = clusterLabel.position.y;
              clusterLabel.lookAt(lookAt);
              clusterLabel.center = labelCenterWorld(clusterLabel);
              clusterLabelLines.push(...clusterLabel.children);
              clusters.push(clusterLabel);
            }
            // 5 random clusters for the visiting stage, ordered nearest-first.
            clustersToVisit = shuffle(clusters.slice())
              .slice(0, 5)
              .sort((a, b) => a.distance - b.distance);
          })
          .catch((e) => console.error(e));
      }

      // In-place Fisher-Yates.
      function shuffle(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
        }
        return arr;
      }

      // " The <ordinal> stop is the <NAME> cluster." for the CLUSTERS_STAGE prompt.
      function clusterInstruction(i) {
        var c = clustersToVisit[i];
        if (!c) return "";
        return " The " + (CLUSTER_ORDINALS[i] || "next") + " stop is the " + c.name + " cluster.";
      }

      function onSphereHover(event) {
        event.preventDefault();
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        if (params.showDensity) {
          updateDensityHover();
          return;
        }
        raycaster.setFromCamera(mouse, camera);
        var intersects = raycaster.intersectObjects(clickableObjects);
        if (intersects.length === 0) {
          var nearest = findNearestStarByScreenPos(mouse, 3);
          if (nearest) intersects = [{ object: nearest}];
        }
        if (intersects.length > 0 && !AnimationRunner.isRunning() && intersects[0].object.text != undefined) {
          var object = intersects[0].object;
          if (object != activeStar) {
            showStarName(object.name);
          }
        } else {
          showStarName("");
        }
      }

      function updateDensityHover() {
        if (!densityMapMesh) return;
        raycaster.setFromCamera(mouse, camera);
        var hits = raycaster.intersectObject(densityMapMesh);
        var id = hits.length > 0 ? hits[0].instanceId : -1;
        // Ignore cells whose colour band is filtered out (still raycast-hit).
        var ud = densityMapMesh.userData;
        if (id !== -1 && ud.bandVisible && !ud.bandVisible[ud.bands[id]]) id = -1;
        if (id === hoveredDensityInstanceId) return;
        if (hoveredDensityInstanceId !== -1) clearDensityHighlight(densityMapMesh, hoveredDensityInstanceId);
        hoveredDensityInstanceId = id;
        if (id !== -1) highlightDensityCell(densityMapMesh, id);
      }

      function showInfo(smooth) {
        if (params.Mode == "Free") {
          if (smooth) {
            showSmoothMessage(WELCOME_MESSAGE);
          } else {
            showMessage(WELCOME_MESSAGE);
          }
        } else {
          switch (progress) {
            case 0:
              if (smooth) {
                showSmoothMessage(CONS_STAGE + "(" + consLeft() + "/10 left)");
              } else {
                showMessage(CONS_STAGE + "(" + consLeft() + "/10 left)");
              }
              recenter(sun);
              showConstellations(true);
              break;
            case 1:
            case 2:
            case 3:
            case 4:
            case 5:
              showMessage(STARS_STAGE + STARS_INSTRUCTIONS[progress - 1]);
              break;
            case 6:
              showArrow(true);
            case 7:
            case 8:
            case 9:
            case 10:
              clustersStageActive = true;
              showMessage(CLUSTERS_STAGE + clusterInstruction(progress - 6));
              break;
            case 11:
              showArrow(false);
              clustersStageActive = false;
              searchCtrl.domElement.classList.remove("hidden");
              showDensityCtrl.domElement.classList.remove("hidden");
              densityBandsCtrl.classList.remove("hidden");
              goToSagACtrl.domElement.classList.remove("hidden");
              showSmoothMessage(MODE_COMPLETED);
          }
        }
      }
      
      function showArrow(show) {
        if (show) {
          var arrowGroup = new THREE.Group();

          var mat = new THREE.MeshPhongMaterial({
            color: turquoise,
            specular: 0x333333,
            shininess: 0,
            emissive: 0x000000,
          });

          var shaftGeom = new THREE.CylinderGeometry(0.018, 0.018, 0.20, 24);
          shaftGeom.rotateX(Math.PI / 2);
          shaftGeom.translate(0, 0, -0.065);
          arrowGroup.add(new THREE.Mesh(shaftGeom, mat));

          var collarGeom = new THREE.CylinderGeometry(0.028, 0.028, 0.018, 24);
          collarGeom.rotateX(Math.PI / 2);
          collarGeom.translate(0, 0, 0.028);
          arrowGroup.add(new THREE.Mesh(collarGeom, mat));

          var headGeom = new THREE.CylinderGeometry(0, 0.075, 0.145, 24);
          headGeom.rotateX(Math.PI / 2);
          headGeom.translate(0, 0, 0.110);
          arrowGroup.add(new THREE.Mesh(headGeom, mat));

          var kl = new THREE.PointLight(0xffffff, 1.6, 1.6);
          kl.position.set(0.4, 0.5, 0.4);
          arrowGroup.add(kl);

          var fl = new THREE.PointLight(0xaaddff, 0.7, 1.6);
          fl.position.set(-0.45, 0.2, 0.35);
          arrowGroup.add(fl);

          var rl = new THREE.PointLight(0x33bbdd, 0.9, 1.0);
          rl.position.set(0.0, -0.4, -0.3);
          arrowGroup.add(rl);

          // 20% larger overall, flattened 65% in vertical (Y) plane
          arrowGroup.scale.set(1.2, 0.35, 1.2);

          arrow = arrowGroup;
          updateArrowHud();
          if (clustersToVisit[progress - 6]) arrow.lookAt(clustersToVisit[progress - 6].center);
          scene.add(arrow);
        } else {
          scene.remove(arrow);
          arrow = undefined;
        }
      }

      function updateArrowHud() {
        if (arrow == undefined || !scene.children.includes(arrow)) return;
        var zDist = 3.0;
        var halfH = Math.tan(camera.fov * Math.PI / 360) * zDist;
        var halfW = halfH * (window.innerWidth / window.innerHeight);
        var ndcX = (28 / window.innerWidth) * 2 - 1;
        var offset = new THREE.Vector3(ndcX * halfW + 0.23, 0.6, -zDist);
        offset.applyQuaternion(camera.quaternion);
        arrow.position.copy(camera.position).add(offset);
      }

      function findNearestStarByScreenPos(mouseNDC, pixelRadius) {
        var _pos = new THREE.Vector3();
        var nearest = null;
        var minDistSq = pixelRadius * pixelRadius;
        for (var i = 0; i < clickableObjects.length; i++) {
          _pos.copy(clickableObjects[i].position).project(camera);
          if (_pos.z >= 1) continue;
          var dx = (_pos.x - mouseNDC.x) * window.innerWidth * 0.5;
          var dy = (_pos.y - mouseNDC.y) * window.innerHeight * 0.5;
          var distSq = dx * dx + dy * dy;
          if (distSq < minDistSq) {
            minDistSq = distSq;
            nearest = clickableObjects[i];
          }
        }
        return nearest;
      }

      function onDocumentMouseDown(event) {
        mouseDownX = event.clientX;
        mouseDownY = event.clientY;
        showStarName("");
      }

      async function onDocumentMouseUp(event) {
        if (!searchEl.contains(event.target)) {
          searchEl.blur();
        }
        event.preventDefault();
        var object;
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        if (Math.abs(mouseDownX - event.clientX) > 5 || Math.abs(mouseDownY - event.clientY) > 5) return;

        if (params.showDensity) {
          if (hoveredDensityInstanceId !== -1 && densityMapMesh) {
            flyToNearestStarAt(getDensityCellCenter(densityMapMesh, hoveredDensityInstanceId));
          }
          return;
        }

        raycaster.setFromCamera(mouse, camera);
        var intersects = raycaster.intersectObjects(clickableObjects);
        if (intersects.length === 0) {
          if (conGameActive) {
            intersects = raycaster.intersectObjects(conLabelLines);
          }
          if (intersects.length === 0) {
            var nearest = findNearestStarByScreenPos(mouse, 3);
            if (nearest) intersects = [{ object: nearest}];
          }
        }
        if (intersects.length > 1 && intersects[0].object.position.distanceTo(camera.position) < 0.1) {
          object = intersects[1].object;
        }
        if (clustersStageActive && intersects.length == 0) {
          intersects = raycaster.intersectObjects(clusterLabelLines);
        }
        if (intersects.length > 0 && !AnimationRunner.isRunning() &&
          (intersects[0].object.apptype != undefined || intersects[0].object.parent.apptype != undefined)) {
          if (object == undefined) {
            object = intersects[0].object;
          }
          // Child meshes of a group (e.g. black hole parts) have localPosition=(0,0,0).
          // Promote to the parent group so recenter() uses the correct world position.
          if (object.type != 'Line' && object.apptype == undefined && object.parent && object.parent.apptype != undefined) {
            object = object.parent;
          }
          await ClickRouter.dispatch(object, intersects);
        }
      }

      // --- Click routing: what a resolved click target does, tried in this
      // order; the default (plain star/black-hole recenter) must stay last.
      ClickRouter.register({
        test: (object) => object.type === "Line" && object.parent.apptype == APPTYPE.CONLABEL && conGameActive,
        handle: async (object) => {
          object.material.color.setHex(turquoise);
          if (chosenCon == null) {
            chosenCon = object.parent;
          } else {
            pairCon = object.parent;
            await delay(1000);
            if (pairCon == chosenCon) {
              return;
            }
            if (pairCon.conGroup != null && pairCon.conGroup == chosenCon.conGroup) {
              showMessage(CONS_HIT);
              var chosenCenter = labelCenterWorld(chosenCon);
              var pairCenter = labelCenterWorld(pairCon);
              var center = new THREE.Vector3().addVectors(pairCenter, chosenCenter).multiplyScalar(0.5);
              var u = new THREE.Vector3().subVectors(chosenCenter, center);
              var v = new THREE.Vector3().crossVectors(center.clone().normalize(), u).normalize().multiplyScalar(u.length() / 3);
              chosenConSteps = [];
              pairConSteps = [];
              for (let i = 0; i <= animationSteps; i++) {
                var ct = Math.PI * (animationSteps - i) / animationSteps;
                chosenConSteps.push(new THREE.Vector3(
                  center.x + u.x * Math.cos(ct) + v.x * Math.sin(ct),
                  center.y + u.y * Math.cos(ct) + v.y * Math.sin(ct),
                  center.z + u.z * Math.cos(ct) + v.z * Math.sin(ct)
                ));
                var st = Math.PI * i / animationSteps;
                pairConSteps.push(new THREE.Vector3(
                  center.x - u.x * Math.cos(st) - v.x * Math.sin(st),
                  center.y - u.y * Math.cos(st) - v.y * Math.sin(st),
                  center.z - u.z * Math.cos(st) - v.z * Math.sin(st)
                ));
              }
              AnimationRunner.play(ANIMATION.CONS_SWAP);
            } else {
              if (pairCon.conGroup != null || chosenCon.conGroup != null) {
                showMessage(CONS_PART_MISS, 5000);
              } else {
                showMessage(CONS_MISS, 5000);
              }
              chosenCon.children[0].material.color.setHex(lightGray);
              pairCon.children[0].material.color.setHex(lightGray);
              chosenCon = undefined;
              pairCon = undefined;
            }
          }
        },
      });

      ClickRouter.register({
        test: (object) => object.type === "Line" && object.parent.apptype == APPTYPE.CLUSTER_LABEL && clustersStageActive,
        handle: (object, intersects) => {
          if (object.parent.visited || camera.position.distanceTo(object.parent.position) > discoverDistance) {
            return;
          }
          if (!clustersToVisit[progress - 6] || object.parent.name != clustersToVisit[progress - 6].name) {
            return;
          }
          constBefore = params.showConstellations;
          showConstellations(false);
          AnimationRunner.play(ANIMATION.CLUSTER_ONE);
          controls.enabled = false;
          showArrow(false);
          object.material.color.setHex(turquoise);
          intersects = intersects.filter((line) => line.object.parent.apptype == APPTYPE.CLUSTER_LABEL);
          activeCluster = intersects[0].object.parent;
          var newTargetPosition = activeCluster.center;
          activeCluster.visited = true;
          var newCameraPosition = new THREE.Vector3();
          newCameraPosition.copy(newTargetPosition);
          var dist = Math.sqrt(newCameraPosition.x * newCameraPosition.x + newCameraPosition.z * newCameraPosition.z) || 1;
          var scale = (dist - CLUSTER_ORBIT_RADIUS) / dist;
          newCameraPosition.x *= scale;
          newCameraPosition.y += cameraElevation;
          newCameraPosition.z *= scale;

          clusterOneCameraStart.copy(camera.position);
          clusterOneCameraEnd.copy(newCameraPosition);
          clusterOneTargetStart.copy(controls.target);
          clusterOneTargetEnd.copy(newTargetPosition);

          var relStartX = newCameraPosition.x - newTargetPosition.x,
            relStartZ = newCameraPosition.z - newTargetPosition.z;
          clusterTwoRadius = CLUSTER_ORBIT_RADIUS;
          clusterTwoStartAngle = Math.atan2(relStartX, relStartZ);
        },
      });

      ClickRouter.register({
        test: () => true,
        handle: (object) => {
          StarAgent.setActiveStar(object.name);
          recenter(object);
          render();
        },
      });

      window.onresize = function () {
        var width = window.innerWidth,
          height = window.innerHeight;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
        Minimap.resize();
        render();
      };

      function labelCenterWorld(con) {
        con.updateMatrixWorld(true);
        return con.localToWorld(con.textCenter.clone());
      }

      function positionLabelOnEllipse(con, centerPoint, spinAngle) {
        con.position.copy(centerPoint);
        con.lookAt(0, 0, 0);
        con.rotateY(spinAngle);
        var offset = con.textCenter.clone().applyQuaternion(con.quaternion);
        con.position.copy(centerPoint).sub(offset);
      }

      function findVisibleStarMesh(name) {
        for (var sphere of visibleStars.values()) {
          if (sphere.name === name) return sphere;
        }
        for (var dyn of starCatalog.dynamicEntries()) {
          if (dyn.mesh.name === name) return dyn.mesh;
        }
        return undefined;
      }

      function recenter(object) {
        if (params.showDensity) return; // density mode owns the scene/clickables — ignore
        AnimationRunner.play(ANIMATION.RECENTER);
        recenterStart = controls.target.clone();
        recenterObject = object;
        if (activeStar != undefined) {
          showLabel(activeStar, false);
        }
        updateScene(object.position, true);
        refreshStarVisuals();
        var target = object.apptype != undefined ? object : findVisibleStarMesh(object.name) || object;
        if (camera.position.distanceTo(target.position) > 0.1 && target.text != undefined) {
          var cameraOffset = new THREE.Vector3().subVectors(camera.position, controls.target);
          var finalCameraPos = object.position.clone().add(cameraOffset);
          showLabel(target, true, finalCameraPos);
        }
        if (target.apptype == APPTYPE.STAR) {
          activeStar = target;
        } else if (target.apptype == APPTYPE.BLACK_HOLE) {
          activeStar = bh;
        }
        if (object.position.distanceTo(bh.position) > 1000) {
          switchSClusterControls(false);
        }
        fetchNearbyStars(object.position);
        fetchStarsAlongPath(recenterStart, object.position);
      }

      function settleAtStar(star) {
        if (activeStar != undefined) {
          showLabel(activeStar, false);
        }
        updateScene(star.position, true);
        refreshStarVisuals();
        var target = star.apptype != undefined ? star : findVisibleStarMesh(star.name) || star;
        if (camera.position.distanceTo(target.position) > 0.1 && target.text != undefined) {
          showLabel(target, true);
        }
        if (target.apptype == APPTYPE.STAR) {
          activeStar = target;
        } else if (target.apptype == APPTYPE.BLACK_HOLE) {
          activeStar = bh;
        }
        if (star.position.distanceTo(bh.position) > 1000) {
          switchSClusterControls(false);
        }
        fetchNearbyStars(star.position);
      }

      async function fetchNearbyStars(position, radiusLy = visibleDistance) {
        const params =
          "x=" + position.x + "&y=" + position.y + "&z=" + position.z + "&radiusLy=" + radiusLy;
        try {
          const [buffer, dictionaries] = await Promise.all([
            fetch("/api/stars/nearby?" + params).then((res) => res.arrayBuffer()),
            fetch("/api/dictionaries/nearby?" + params).then((res) => res.json()),
          ]);
          starCatalog.addBatch(buffer, dictionaries);
          updateScene(position, true);
          refreshStarVisuals();
        } catch (e) {
          console.error(e);
        }
      }

      function fetchStarsAlongPath(startPos, endPos) {
        const totalDistance = startPos.distanceTo(endPos);
        const direction = endPos.clone().sub(startPos).normalize();
        const waypointRadius = visibleDistance / 2;
        for (let d = visibleDistance; d < totalDistance; d += visibleDistance) {
          const waypoint = startPos.clone().addScaledVector(direction, d);
          fetchNearbyStars(waypoint, waypointRadius);
        }
      }

      async function setupScene() {
        loadStep = 0;
        updateProgressText();
        scene.traverse(disposeMaterial);
        scene.children.length = 0;
        const constellationLineMaterial = new THREE.LineBasicMaterial({ color: gray });
        await readConstellationData();
        showGalaxyCenter();
        const initialBufferPromise = fetch("/api/stars/initial?maxLy=" + visibleDistance)
          .then((res) => res.arrayBuffer())
          .then((buf) => { loadStep++; updateProgressText(); return buf; });
        const dictionariesPromise = fetch("/api/dictionaries?maxLy=" + visibleDistance)
          .then((res) => res.json())
          .then((dict) => { loadStep++; updateProgressText(); return dict; });
        const sClusterPromise = fetch("./files/s_cluster_data.txt")
          .then((res) => res.text())
          .then((text) => { loadStep++; updateProgressText(); return text; });
        const visibilityConfigPromise = fetch("/api/star-visibility-config")
          .then((res) => res.json())
          .then((cfg) => { loadStep++; updateProgressText(); return cfg; });
        await Promise.all([initialBufferPromise, dictionariesPromise, sClusterPromise, visibilityConfigPromise])
          .then(async ([initialBuffer, dictionaries, sClusterText, fetchedVisibilityConfig]) => {
            visibilityConfig = fetchedVisibilityConfig;
            starCatalog.build([initialBuffer], dictionaries, (position, index) => {
              var name = starCatalog.getName(index);
              if (controls.target.distanceTo(position) < visibleDistance) {
                var sphere = createStar(starCatalog, index);
                visibleStars.set(index, sphere);
                scene.add(sphere);
                clickableObjects.push(sphere);
                for (let cline of constellations) {
                  for (let cstar of cline) {
                    if (cstar.name === sphere.name) {
                      cstar.position = sphere.position;
                    }
                  }
                }
              } else if (constellationStar(name)) {
                // Only its position is needed to draw constellation lines —
                // no Mesh required for a star this far outside view.
                for (let cline of constellations) {
                  for (let cstar of cline) {
                    if (cstar.name === name) {
                      cstar.position = position.clone();
                    }
                  }
                }
              }
            });
            updateLoadProgress();
            for (let data of constellations) {
              const constellationPoints = [];
              for (let star of data) {
                if (star.position.x === undefined) {
                  console.warn(star.name + " data is missing");
                }
                constellationPoints.push(star.position);
              }
              constellationLines.push(constellationPoints);
              var lineGeometry = new THREE.BufferGeometry().setFromPoints(constellationPoints);
              var line = new THREE.Line(lineGeometry, constellationLineMaterial);
              line.visible = false;
              line.apptype = APPTYPE.CONLINE;
              lines.push(line);
              scene.add(line);
            }
            Minimap.build(constellationLines, minimapLabelData);
            updateLoadProgress();
            // Init S-cluster stars using same geometry/scale as regular stars
            var starGeometry = new THREE.SphereGeometry(1, 6, 6);
            var sElements = SCluster.parse(sClusterText);
            SCluster.init(scene, bh, sElements, { starGeometry, DEFAULT_RADIUS, APPTYPE });
            SCluster.initOrbits(scene, gray);
            for (const mesh of SCluster.getMeshes()) {
              clickableObjects.push(mesh);
              starCatalog.push({ name: mesh.name, data: "", position: mesh.position, mesh: mesh });
            }

            showLabel(activeStar, true);
            StarVisuals.init({ scene: scene, camera: camera, stars: currentVisibleMeshes(), visibilityConfig: visibilityConfig });
            loadStep++; updateProgressText();
          })
          .catch((e) => console.error(e));
        showInfo(true);
        render();
      }

      async function updateLoadProgress() {
        loadStep++;
        updateProgressText();
        await new Promise((r) => setTimeout(r, 0));
      }

      function showGalaxyCenter() {
        var pos = new THREE.Vector3().setFromSphericalCoords(26996, 2.077078, 4.649851);
        bh = BlackHole.create(scene, pos, 0.005);
        bh.name = "Sagittarius A*";
        bh.apptype = APPTYPE.BLACK_HOLE;
        bh.initialscale = 0.005;
        bh.text = "Supermassive black hole. 4297000 solar masses.";
        scene.add(bh);
        clickableObjects.push(bh);
      }
      
      function constellationStar(starName) {
        for (let line of constellations) {
          for (let star of line) {
            if (star.name === starName) {
              return true;
            }
          }
        }
        return false;
      }
      
      function createStar(catalog, index) {
        var color = new THREE.Color(),
          name = catalog.getName(index),
          spectralType = catalog.getSpectralType(index);
        color.setHex(getColorBySpectralType(spectralType));
        var material = new THREE.MeshBasicMaterial({ color: color }),
          sphere = new THREE.Mesh(starGeometry, material);
        catalog.getPosition(index, sphere.position);
        if (name === "Sun") {
          sun = sphere;
          activeStar = sphere;
        }
        sphere.name = name;
        var secondName = starNames.find((star) => star.code == name);
        if (secondName != null) {
          sphere.secondName = secondName.name;
        }

        var size = catalog.getDiameterSolar(index);
        if (!(size > 0)) size = "NA";
        sphere.scale.setScalar(DEFAULT_RADIUS);
        sphere.apptype = APPTYPE.STAR;
        sphere.initialscale = sphere.scale.x;
        sphere.spectralClass = spectralType ? (spectralType.match(/[OBAFGKMLTYXWDC]/) || [""])[0] : "";
        sphere.spectralType  = spectralType || "";
        var ly = sphere.position.length();
        sphere.text = ly.toFixed(0) + " ly. Type " + catalog.getOtype(index) + " Class " + spectralType +
          (typeof size == "number" && size.toFixed(0) > 1 ? ". " + size.toFixed(0) + " Sun radii" : "");
        if (sphere == sun) {
          sphere.text = "Class " + spectralType;
        }
        return sphere;
      }
      
      async function showSmoothMessage(message) {
        actualMessage = message;
        for (var i = 0; i <= message.length; i++) {
          info.innerText = message.substring(0, i);
          await delay(SMOOTH_MESSAGE_TIMEOUT);
          if (message != actualMessage) {
            break;
          }
        }
      }
      
      async function showMessage(message, timeout) {
        if (!tempMessage) {
          oldText = info.innerText;
        }
        info.innerText = message;
        if (timeout) {
          tempMessage = true;
          await delay(timeout);
          info.innerText = oldText;
          tempMessage = false;
        }
      }
      
      function showStarName(message) {
        starName.innerText = starDisplayName(message);
      }

      function starDisplayName(name) {
        return /^\d+$/.test(name) ? "Gaia DR3 " + name : name;
      }

      function cameraUpVector() {
        return new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
      }

      function labelViewRight(starPosition, facing) {
        var viewForward = new THREE.Vector3().subVectors(starPosition, facing);
        if (viewForward.lengthSq() < 1e-12) viewForward.set(0, 0, -1);
        viewForward.normalize();
        var viewRight = new THREE.Vector3().crossVectors(viewForward, cameraUpVector());
        if (viewRight.lengthSq() < 1e-12) viewRight.set(1, 0, 0);
        return viewRight.normalize();
      }

      function createStarLabel(sphere, anchorPosition, facing) {
        var displayName = starDisplayName(sphere.name);
        var name = sphere.secondName != undefined
            ? sphere.secondName + " (" + displayName + ")"
            : displayName;
        var group = new THREE.Object3D();
        group.add(createLabel(name, 0.02, new THREE.Vector3(0, 0, 0)));
        group.add(createLabel(sphere.text, 0.005, new THREE.Vector3(0, -0.015, 0)));
        group.position.copy(anchorPosition);
        // Object3D.lookAt's own internal cross product uses this.up as the
        // up reference — swap in the camera's live up axis so that
        // computation is singularity-free too (see cameraUpVector above).
        group.up.copy(cameraUpVector());
        group.lookAt(facing);
        return group;
      }

      function showLabel(sphere, show, lookAtPosition) {
        if (!show) {
          scene.remove(sphere.label);
          disposeLabel(sphere.label);
          sphere.label = undefined;
        } else {
          var facing = lookAtPosition || camera.position;
          var labelOffset = sphere.apptype === APPTYPE.BLACK_HOLE ? 8 : 24;
          var viewRight = labelViewRight(sphere.position, facing);
          var anchor = sphere.position.clone().addScaledVector(viewRight, labelOffset * sphere.initialscale);
          sphere.label = createStarLabel(sphere, anchor, facing);
          scene.add(sphere.label);
        }
      }

      var LABEL_UPDATE_MAX_DIST = 15;

      function updateActiveStarLabelTransform() {
        if (!activeStar || !activeStar.label) return;
        if (camera.position.distanceTo(activeStar.position) > LABEL_UPDATE_MAX_DIST) return;
        var labelOffset = activeStar.apptype === APPTYPE.BLACK_HOLE ? 8 : 24;
        var viewRight = labelViewRight(activeStar.position, camera.position);
        activeStar.label.position.copy(activeStar.position).addScaledVector(viewRight, labelOffset * activeStar.initialscale);
        activeStar.label.up.copy(cameraUpVector());
        activeStar.label.lookAt(camera.position);
      }
      
      function createLabel(message, size, position, color) {
        var matColor = color == undefined ? white : color;
        var labelMat = new THREE.LineBasicMaterial({
          color: matColor,
          side: THREE.DoubleSide,
        });
        var shapes = mainFont.generateShapes(message, size);
        var holeShapes = [];
        for (var i = 0; i < shapes.length; i++) {
          var shape = shapes[i];
          if (shape.holes && shape.holes.length > 0) {
            for (var j = 0; j < shape.holes.length; j++) {
              var hole = shape.holes[j];
              holeShapes.push(hole);
            }
          }
        }
        shapes.push.apply(shapes, holeShapes);
        var label = new THREE.Object3D();
        for (var i = 0; i < shapes.length; i++) {
          label.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(shapes[i].getPoints()), labelMat));
        }
        label.position.copy(position);
        var textBox = new THREE.Box3();
        for (var i = 0; i < label.children.length; i++) {
          label.children[i].geometry.computeBoundingBox();
          textBox.union(label.children[i].geometry.boundingBox);
        }
        label.textCenter = new THREE.Vector3();
        textBox.getCenter(label.textCenter);
        return label;
      }
      
      function readConstellationData() {
        minimapLabelData.length = 0;
        const p1 = fetch("./files/cons_lines.txt")
          .then((res) => res.text())
          .then((text) => {
            for (let line of text.split("\n")) {
              var listOfStars = [];
              for (let star of line.split("|")) {
                var obj = {};
                obj.name = star;
                obj.position = {};
                listOfStars.push(obj);
              }
              constellations.push(listOfStars);
            }
            loadStep++; updateProgressText();
          })
          .catch((e) => console.error(e));
        const p2 = fetch("./files/constellations.txt")
          .then((res) => res.text())
          .then((text) => {
            for (let line of text.split("\n")) {
              var data = line.split("|");
              var coord = data[1].split(" "),
                conLabel = createLabel(data[0], 0.4, controls.target, lightGray);
              conLabel.position.setFromSphericalCoords(30, coord[0], coord[1]);
              for (let child of conLabel.children) {
                child.geometry.translate(-conLabel.textCenter.x, -conLabel.textCenter.y, 0);
              }
              conLabel.textCenter.set(0, 0, 0);
              conLabel.visible = false;
              conLabel.apptype = APPTYPE.CONLABEL;
              conLabel.conGroup = null;
              conLabel.conName = data[0];
              conLabel.lookAt(controls.target);
              conLabelLines.push(...conLabel.children);
              constellationNames.push(conLabel);
              scene.add(conLabel);
              minimapLabelData.push({ name: data[0], theta: parseFloat(coord[0]), phi: parseFloat(coord[1]) });
            }
            var neighborPairs = [];
            for (let i = 0; i < constellationNames.length; i++) {
              for (let j = i + 1; j < constellationNames.length; j++) {
                if (constellationNames[i].position.angleTo(constellationNames[j].position) <= Math.PI / 6) {
                  neighborPairs.push([constellationNames[i], constellationNames[j]]);
                }
              }
            }
            for (let i = neighborPairs.length - 1; i > 0; i--) {
              var j = Math.floor(Math.random() * (i + 1));
              [neighborPairs[i], neighborPairs[j]] = [neighborPairs[j], neighborPairs[i]];
            }
            var used = new Set(), groupId = 1;
            for (let [a, b] of neighborPairs) {
              if (!used.has(a) && !used.has(b)) {
                a.conGroup = groupId;
                b.conGroup = groupId;
                groupId++;
                used.add(a);
                used.add(b);
                swapConsOnInit(a, b);
                if (groupId > 5) break;
              }
            }
            loadStep++; updateProgressText();
          })
          .catch((e) => console.error(e));
        return Promise.all([p1, p2]);
      }
      
      function swapConsOnInit(first, second) {
        var position = first.position.clone();
        first.position.copy(second.position);
        second.position.copy(position);
        first.lookAt(0.0, 0.0, 0.0);
        second.lookAt(0.0, 0.0, 0.0);
      }
      
      function disposeMaterial(obj) {
        if (obj.material) {
          obj.material.dispose();
        }
      }

      function disposeLabel(label) {
        if (!label) return;
        var materials = new Set();
        label.traverse(function (child) {
          if (child.geometry) child.geometry.dispose();
          if (child.material) materials.add(child.material);
        });
        materials.forEach(function (mat) { mat.dispose(); });
      }
      
      function tickRecenter() {
        var t = AnimationRunner.step / animationSteps;
        var ease = (1 - Math.cos(Math.PI * t)) / 2;
        var targetPos = recenterStart.clone().lerp(recenterObject.position, ease);
        var move = new THREE.Vector3().subVectors(targetPos, controls.target);
        controls.target.copy(targetPos);
        camera.position.add(move);
        camera.lookAt(controls.target);
        if (AnimationRunner.step >= animationSteps) {
          AnimationRunner.stop();
          recenterObject = null;
          updateScene(activeStar.position, false);
          refreshStarVisuals();
          if (params.Mode == EXPLORATORY_MODE && activeStar.name == STARS_TO_VISIT[progress - 1]) {
            showSmoothMessage("Well done! " + STARS_INFO[progress - 1]);
            var audio = new Audio("./files/paz.mp3");
            audio.volume = 0.5;
            audio.play();
            setTimeout(() => {
              progress++;
              if (progress === 6) moveSpeedCtrl.domElement.classList.remove("hidden");
              showInfo();
            }, 15000);
          }
        }
      }

      function tickConsSwap() {
        var t = AnimationRunner.step / animationSteps;
        var ease = (1 - Math.cos(Math.PI * t)) / 2;
        var spinAngle = (10 * Math.PI) * ease;
        positionLabelOnEllipse(chosenCon, chosenConSteps[animationSteps - AnimationRunner.step], spinAngle);
        positionLabelOnEllipse(pairCon, pairConSteps[AnimationRunner.step], spinAngle);
        if (AnimationRunner.step >= animationSteps) {
          AnimationRunner.stop();
          chosenCon.children[0].material.color.setHex(lightGray);
          pairCon.children[0].material.color.setHex(lightGray);
          pairCon.conGroup = null;
          chosenCon.conGroup = null;
          chosenCon = null;
          pairCon = null;
          var left = consLeft();
          if (left > 0) {
            showMessage(CONS_STAGE + "(" + left + "/10 left)");
          } else {
            showMessage(CONS_COMPLETED);
            showConstCtrl.domElement.classList.remove("hidden");
            showMinimapCtrl.domElement.classList.remove("hidden");
            conGameActive = false;
            params.showConstellations = true;
            showConstCtrl.updateDisplay();
            showConstellations(true);
            progress++;
            setTimeout(() => {
              showInfo();
            }, 10000);
          }
        }
      }

      function tickClusterOne() {
        if (activeStar != undefined) {
          showLabel(activeStar, false);
        }
        var ease = (1 - Math.cos(Math.PI * AnimationRunner.step / animationSteps)) / 2;
        camera.position.copy(clusterOneCameraStart).lerp(clusterOneCameraEnd, ease);
        controls.target.copy(clusterOneTargetStart).lerp(clusterOneTargetEnd, ease);
        camera.lookAt(controls.target);
        if (AnimationRunner.step >= animationSteps) {
          AnimationRunner.play(ANIMATION.CLUSTER_TWO);
          if (activeCluster) activeCluster.visible = false;
          var audio = new Audio("./files/ekm.mp3");
          audio.volume = 0.5;
          audio.play();
          if (params.Mode == EXPLORATORY_MODE && activeCluster === clustersToVisit[progress - 6]) {
            showSmoothMessage("Well done! " + (activeCluster.info || ""));
            setTimeout(() => {
              progress++;
              showInfo();
            }, 26000);
          }
        }
      }

      function tickClusterTwo() {
        const clustTempInc = (2 * Math.PI) / clusterAnimationSteps;
        var anglePrev = clusterTwoStartAngle - clustTempInc * (AnimationRunner.step - 1),
          angleNow = clusterTwoStartAngle - clustTempInc * AnimationRunner.step; // clockwise (viewed from above)
        camera.position.x += clusterTwoRadius * (Math.sin(angleNow) - Math.sin(anglePrev));
        camera.position.z += clusterTwoRadius * (Math.cos(angleNow) - Math.cos(anglePrev));
        camera.lookAt(controls.target);
        if (AnimationRunner.step >= clusterAnimationSteps) {
          if (clustersToVisit.indexOf(activeCluster) < clustersToVisit.length - 1) {
            setTimeout(() => {
              showArrow(true);
            }, 1000);
          }
          controls.enabled = true;
          AnimationRunner.stop();
          showConstellations(constBefore);
          if (activeCluster) activeCluster.visible = true;
          if (activeCluster) activeCluster.children[0].material.color.setHex(white);
        }
      }

      function tickSCluster() {
        var now = performance.now();
        sClusterTime += (now - (sClusterLastReal || now)) / 1000.0;
        sClusterLastReal = now;
        var prevActivePos = (activeStar && activeStar.dynamicPosition) ? activeStar.position.clone() : null;
        SCluster.update(sClusterTime);
        sClusterYearObj.year = Math.round(sClusterTime);
        StarVisuals.markDynamicDirty();
        if (activeStar && activeStar.dynamicPosition) {
          if (!AnimationRunner.isPlaying(ANIMATION.RECENTER)) {
            var delta = new THREE.Vector3().subVectors(activeStar.position, controls.target);
            controls.target.add(delta);
            camera.position.add(delta);
            if (activeStar.label) activeStar.label.position.add(delta);
          } else if (prevActivePos) {
            var labelDelta = new THREE.Vector3().subVectors(activeStar.position, prevActivePos);
            if (activeStar.label) activeStar.label.position.add(labelDelta);
          }
        }
      }

      function render() {
        if (bh && sClusterAnimating) tickSCluster();
        AnimationRunner.update();
        updateActiveStarLabelTransform();
        StarVisuals.update();
        BlackHole.update(camera);
        if (arrow != undefined && scene.children.includes(arrow) && clustersToVisit[progress - 6]) {
          updateArrowHud();
          arrow.lookAt(clustersToVisit[progress - 6].center);
        }
        updateNebula(camera);
        adjustStars();
        if (sun && !controls.target.equals(_lastDistTarget)) {
          _lastDistTarget.copy(controls.target);
          var lyDist = controls.target.distanceTo(sun.position).toFixed();
          document.getElementById("distance").textContent = lyDist == 0 ? "" : (lyDist < 10000 ? (lyDist + " ly") : ((lyDist/1000).toFixed() + " Kly")) + " from the Sun";
        }
        BlackHole.render(renderer, scene, camera);
        Minimap.render(camera, controls, params.showMinimap && (!activeStar || activeStar.name !== "Sun"));
      }

      function adjustStars() {
        var h = renderer.domElement.height;
        var fovFactor = h / (2 * Math.tan(camera.fov * Math.PI / 360));
        for (var obj of scene.children) {
          if (obj.apptype == APPTYPE.STAR) {
            var distance = obj.position.distanceTo(camera.position);
            if (distance < 0.001) continue;
            var hideMaxDist = maxVisibilityDistance(obj.spectralType, visibilityConfig);
            if (distance > hideMaxDist) {
              obj.material.colorWrite = false;
              obj.material.depthWrite = false;
              continue;
            }
            obj.material.colorWrite = true;
            obj.material.depthWrite = true;
            var projectedRadius = (obj.initialscale / distance) * fovFactor;
            if (projectedRadius < 1.0) {
              obj.scale.setScalar(distance / fovFactor);
            } else {
              obj.scale.setScalar(obj.initialscale);
            }
          }
        }
      }
      
      // All currently-visible star meshes (regular + S-cluster) — passed to
      // StarVisuals whenever the visible set has changed.
      function currentVisibleMeshes() {
        var list = Array.from(visibleStars.values());
        for (var dyn of starCatalog.dynamicEntries()) list.push(dyn.mesh);
        return list;
      }

      function refreshStarVisuals() {
        StarVisuals.rebuild(currentVisibleMeshes());
      }

      function updateScene(position, show) {
        var pos = starCatalog.positions,
          r2 = visibleDistance * visibleDistance;
        if (show) {
          var px = position.x, py = position.y, pz = position.z;
          for (var i = 0; i < starCatalog.count; i++) {
            if (visibleStars.has(i)) continue;
            var ix = i * 3,
              dx = pos[ix] - px, dy = pos[ix + 1] - py, dz = pos[ix + 2] - pz,
              d2 = dx * dx + dy * dy + dz * dz;
            if (d2 >= r2) continue;
            var addMaxDist = maxVisibilityDistance(starCatalog.getSpectralType(i), visibilityConfig);
            if (d2 > addMaxDist * addMaxDist) continue;
            var sphere = createStar(starCatalog, i);
            visibleStars.set(i, sphere);
            scene.add(sphere);
            clickableObjects.push(sphere);
          }
          for (var dyn of starCatalog.dynamicEntries()) {
            if (dyn.position.distanceTo(position) < visibleDistance && !clickableObjects.includes(dyn.mesh)) {
              scene.add(dyn.mesh);
              clickableObjects.push(dyn.mesh);
            }
          }
        } else {
          for (var [idx, sphere] of visibleStars) {
            var keepMaxDist = maxVisibilityDistance(sphere.spectralType, visibilityConfig);
            if (sphere.position.distanceTo(position) > keepMaxDist) {
              scene.remove(sphere);
              disposeMaterial(sphere);
              visibleStars.delete(idx);
              var ci = clickableObjects.indexOf(sphere);
              if (ci !== -1) clickableObjects.splice(ci, 1);
            }
          }
          for (var dyn of starCatalog.dynamicEntries()) {
            if (dyn.mesh.position.distanceTo(controls.target) > visibleDistance) {
              scene.remove(dyn.mesh);
              var ci = clickableObjects.indexOf(dyn.mesh);
              if (ci !== -1) clickableObjects.splice(ci, 1);
            }
          }
        }

        for (var cluster of clusters) {
          if (discoverDistance > position.distanceTo(cluster.position)) {
            scene.add(cluster);
          } else {
            scene.remove(cluster);
          }
        }
        console.log("Scene objects " + scene.children.length);
      }
      
    </script>
  </body>
