<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Sun stellar neighborhood Nearby stars 3D</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <link type="text/css" rel="stylesheet" href="main.css" />
  </head>

  <body>
    <div id="header">
      <span id="state"></span>
      <span id="info">Loading. Please wait.</span>
    </div>

    <script src="star-agent.js"></script>
    <script src="star-visuals.js" type="module"></script>

    <script type="x-shader/x-vertex" id="vertexshader">
      varying vec2 vUv;
      void main() {
      	vUv = uv;
      	gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
      }
    </script>

    <script type="x-shader/x-fragment" id="fragmentshader">
      uniform sampler2D baseTexture;
      uniform sampler2D bloomTexture;
      varying vec2 vUv;

      vec4 getTexture( sampler2D texelToLinearTexture ) {
      	return mapTexelToLinear( texture2D( texelToLinearTexture , vUv ) );
      }

      void main() {
      	gl_FragColor = ( getTexture( baseTexture ) + vec4( 1.0 ) * getTexture( bloomTexture ) );
      }
    </script>

    <script type="module">
      import * as THREE from "./build/three.module.js";
      import { GUI } from "./jsm/libs/dat.gui.module.js";
      import { OrbitControls } from "./jsm/controls/OrbitControls.js";
      import { EffectComposer } from "./jsm/postprocessing/EffectComposer.js";
      import { RenderPass } from "./jsm/postprocessing/RenderPass.js";
      import { ShaderPass } from "./jsm/postprocessing/ShaderPass.js";
      import { UnrealBloomPass } from "./jsm/postprocessing/UnrealBloomPass.js";
      
      const WELCOME_MESSAGE = "Welcome to the vicinity of the Sun. Switch to exploratory mode to study the mechanics of the model or navigate between stars in free mode.";
      const FEEDBACK_MESSAGE = "Your feedback is always welcome: jeffrey3829@proton.me";
      const ABOUT_MESSAGE = "Stars brightness and size not to scale. Do not consider as a source of reliable data. Please use Chrome for a better experience. This model has made use of the SIMBAD database, CDS, Strasbourg Astronomical Observatory, France.";
      const CONS_STAGE = "Looks like some constellations names are misplaced. Will you be able to find pairs of incorrectly named constellations? Click the constellations names which are out of place.";
      const CONS_HIT = "        Well done! Let's put them in their place.";
      const CONS_MISS = "                  No,these two are in place.";
      const CONS_PART_MISS = "            One of these two is misplaced. Take a closer look.";
      const CONS_COMPLETED = "Hooray! Now all constellations are in place. The setting to hide/show constellations is available now.";
      const STARS_STAGE = "Let's find the most interesting neighboring stars. Use 'Go to Sun' if you got lost. ";
      const STARS_TO_VISIT = [
        "* alf CMa",
        "* alf Lyr",
        "* alf PsA",
        "* alf Tau",
        "* alf Boo",
      ];
      const STARS_INSTRUCTIONS = [
        "The first stop is Sirius (Alpha CANIS MAJOR)",
        "The next stop is Vega (Alpha LYRA)",
        "Would you like to see Fomalhaut? (Alpha PISCIS AUSTRINUS)",
        "Why not visit Aldebaran? (Alpha TAURUS)",
        "The last destination is Arcturus (Alpha BOOTES)",
      ];
      const STARS_INFO = [
        "Sirius is the brightest star in the night sky. It's a binary star consisting of a main-sequence star Sirius A, and a faint white dwarf Sirius B.",
        "Vega is the fifth-brightest star in the night sky and is only about a tenth of the age of the Sun.",
        "Fomalhaut is a class A star on the main sequence approximately 25 light-years from the Sun.",
        "Aldebaran is a red giant with a surface temperature of 3,900 K, it is over 400 times as luminous as the Sun.",
        "Arcturus is a red giant of spectral type K, an aging star around 7.1 billion years old.",
      ];
      const CLUSTERS_STAGE = "Looks like it's time to visit nearest star clusters. Move with WASD. Use mouse panning to correct the direction and the compas to navigate. Zoom in to see the compass.";
      const CLUSTERS_TO_VISIT = ["HYADES", "PLEIADES", "BEEHIVE", "IC 2391", "NGC 3532"];
      const CLUSTERS_INSTRUCTIONS = [
        " The first stop is HYADES cluster in Taurus",
        " Next let's visit the PLEIADES cluster which is also in Taurus but a bit further",
        " Now let's head to the BEEHIVE cluster in Cancer",
        " The next stop is IC 2391 in Vela",
        " And the last one is NGC 3532 in Carina",
      ];
      const CLUSTERS_INFO = [
        "The age of the Hyades is estimated to be about 625 million years. The core of the cluster, where stars are the most densely packed, has a radius of 8.8 light-years, and the cluster's tidal radius is 33 light-years.",
        "The cluster is dominated by hot blue luminous stars that have formed within the last 100 million years. Astronomers estimate that the cluster will survive for approximately another 250 million years, after which the clustering will be lost due to gravitational interactions with the galactic neighborhood.",
        "Age and proper motion of the Beehive Cluster coincide with those of the Hyades, suggesting they may share similar origins. Both clusters also contain red giants and white dwarfs, which represent later stages of stellar evolution, along with many main sequence stars.",
        "IC 2391 is an open cluster in the constellation Vela consisting of hot, young, blueish stars, some of which binaries and one of which is a quadruple.",
        "NGC 3532 is an open cluster in the constellation Carina. Its population of approximately 150 stars of 7th magnitude or fainter includes seven red giants and seven white dwarfs.",
      ];
      const MODE_COMPLETED = "Exploratory mode completed. Search by star name is available now. You can also use density setting to find interesting areas in Sun surroundings.";
      const EXPLORATORY_MODE = "Exploratory";
      const APPTYPE = {
        nrv: "nrv",
        non: "non",
        STAR: "STAR",
        njy: "njy",
        BLACK_HOLE: "BLACK_HOLE",
      };
      const nax = { mzz: "mzz", myz: "myz", mxm: "mxm", muc: "muc" };
      var scene, camera, controls, renderer;
      const SUN_DIAMETER = 1391400,
        DEFAULT_RADIUS = 0.01;
      var dkk,
        dly = 200,
        dnw = 1500,
        dqx = 10,
        dsx = Math.PI / dly;
      var dvr = (2 * Math.PI) / dnw,
        dzv = 0,
        ebd = 6;
      var ecz = [],
        edv = [],
        constellationNames = [],
        lines = [],
        spheres = [],
        eqo = [],
        etu = [],
        eyb = [],
        starPositions = [];
      var fcg = 0xffffff,
        fdn = 0x1996af,
        ffx = 0x161616,
        rde = 0xff0000,
        org = 0xcc6600,
        yll = 0xffff00;
      var fhu = false,
        clustersStageActive = false,
        fld,
        fmq,
        fnv,
        arrow,
        fsu,
        fur,
        fwk,
        fzt,
        sun;
      var gdh = [],
        geq = [],
        gfv = [],
        ghb = [],
        gjm = [],
        glq = [],
        gny = [],
        ttt = [];
      var hbn = 240.0,
        hcz = new THREE.Vector3(),
        ooo = 500.0,
        hfy = 80.0,
        his = 40.0;
      var hmi = new THREE.Vector3(),
        starGeometry = new THREE.IcosahedronBufferGeometry(1, 4);
      var progress = 0,
        huq = 30,
        mouseDownX, mouseDownY;
      var ieq = [],
        ihm = [],
        iky = [],
        inc = [],
        iom = [],
        iqp = [],
        ist = [],
        ivu = [],
        jay = [],
        jhw = [],
        jmt = [],
        jvo;
      const jyg = (millis) =>
        new Promise((resolve, reject) => {
          setTimeout((_) => resolve(), millis);
        });
      var kbi = new THREE.FontLoader();
      kbi.load("urbanist_bold.json", function (kdp) {
        jvo = kdp;
      });
      var params = {
        exposure: ebd,
        bloomStrength: 6,
        bloomThreshold: 0,
        bloomRadius: 1,
        Mode: "Free",
        showConstellations: false,
        showDensity: false,
        Info: "None",
        Search: "",
      };
      var khb = new THREE.MeshBasicMaterial({ color: "black" });
      var khm = {};
      renderer = new THREE.WebGLRenderer({ antialias: false });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ReinhardToneMapping;
      renderer.toneMappingExposure = ebd;
      document.body.appendChild(.domElement);
      const kjd = document.getElementById("state");
      const kkj = document.getElementById("info");
      var klv, koj;
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(
        40,
        window.innerWidth / window.innerHeight,
        0.1,
        50000.0
      );
      camera.position.set(0, 0, 3);
      camera.lookAt(0, 0, 0);
      controls = new OrbitControls(camera, renderer.domElement);
      controls.minDistance = 0.5;
      controls.maxDistance = 50000.0;
      controls.enableKeys = false;
      controls.enablePan = false;
      controls.addEventListener("change", wup);
      var kqp = new RenderPass(scene, camera);
      var bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        1.5,
        0.4,
        0.85
      );
      bloomPass.threshold = params.bloomThreshold;
      bloomPass.strength = params.bloomStrength;
      bloomPass.radius = params.bloomRadius;
      var composer = new EffectComposer(renderer);
      composer.renderToScreen = false;
      composer.addPass(kqp);
      composer.addPass(bloomPass);
      var shaderPass = new ShaderPass(
        new THREE.ShaderMaterial({
          uniforms: {
            baseTexture: { value: null },
            bloomTexture: { value: composer.renderTarget2.texture },
          },
          vertexShader: document.getElementById("vertexshader").textContent,
          fragmentShader: document.getElementById("fragmentshader").textContent,
          defines: {},
        }),
        "baseTexture"
      );
      shaderPass.needsSwap = true;
      var finalComposer = new EffectComposer(renderer);
      finalComposer.addPass(kqp);
      finalComposer.addPass(shaderPass);
      var ldg = new THREE.Raycaster(),
        mouse = new THREE.Vector2();
      window.addEventListener("mouseup", onDocumentMouseUp, false);
      window.addEventListener("mousedown", onDocumentMouseDown, false);
      window.addEventListener("mousemove", oyi, false);
      document.addEventListener("keydown", function (event) {
        if (document.activeElement === searchEl) {
          return;
        }
        var liq, ljt, lmg;
        if ([87, 83, 65, 68].includes(event.keyCode)) {
          if (progress < 6 || dkk != null) {
            return;
          }
          liq = (camera.position.x - controls.target.x) / 100.0;
          ljt = (camera.position.y - controls.target.y) / 100.0;
          lmg = (camera.position.z - controls.target.z) / 100.0;
          var ltz = Math.floor(
            0.8 / Math.max(Math.abs(liq), Math.abs(ljt), Math.abs(lmg))
          );
          if (ltz > 0) {
            liq *= ltz;
            ljt *= ltz;
            lmg *= ltz;
          }
        }
        switch (event.keyCode) {
          case 87:
            liq = -liq;
            ljt = -ljt;
            lmg = -lmg;
            break;
          case 83:
            break;
          case 65:
            ljt = 0.0;
            var temp = liq;
            liq = -lmg;
            lmg = temp;
            break;
          case 68:
            ljt = 0.0;
            var temp = liq;
            liq = lmg;
            lmg = -temp;
            break;
        }
        if ([87, 83, 65, 68].includes(event.keyCode)) {
          var lwr = new THREE.Vector3(liq, ljt, lmg);
          camera.position.add(lwr);
          controls.target.add(lwr);
          camera.lookAt(controls.target);
          if (arrow != undefined && scene.children.includes(arrow)) {
            arrow.position.add(lwr);
            arrow.lookAt(gjm[progress - 6].center);
          }
          if (hmi.distanceTo(controls.target) > hfy / 4) {
            xvn(controls.target, true);
            xvn(controls.target, false);
            hmi.copy(controls.target);
            clearScene();
          }
        }
      });
      var gui = new GUI();
      gui.width = 300;
      gui.add(params, "Mode", ["Free", "Exploratory"])
        .onChange(function (value) {
          switch (value) {
            case "Free":
              showMessage(WELCOME_MESSAGE);
              break;
            case "Exploratory":
              if (progress < 6) {
                fhu = true;
              }
              showInfo(true);
              break;
          }
        });
      gui.add(params, "showConstellations")
        .name("Show constellations")
        .onChange(function (value) {
          showConstellations(value);
        });
      gui.add(params, "showDensity")
        .name("Show density")
        .onChange(function (value) {
          ggg(value);
        });
      
      function ggg(yyy) {
        params.showDensity = yyy;
        for (var rrr of ttt) {
          if (yyy && rrr.position.distanceTo(controls.target) < ooo) {
            scene.add(rrr);
          }
          if (!yyy) {
            scene.remove(rrr);
          }
        }
      }
      
      function showConstellations(value) {
        params.showConstellations = value;
        for (let line of lines) {
          line.visible = value;
        }
        for (let name of constellationNames) {
          name.visible = value;
        }
      }
      
      function consLeft() {
        return constellationNames.filter((name) => name.conGroup != null).length;
      }
      
      var mpp = {
        goToSun: function () {
          if (controls.position != sun.position) {
            recenter(sun);
          }
        },
      };
      gui.add(mpp, "goToSun").name("Go to Sun");
      gui.add(params, "Search").onFinishChange(function (msi) {
        var mro = starPositions.find((mts) => mts.name == msi);
        if (mro == null) {
          var mvn = ghb.find((mwp) => mwp.name == msi);
          if (mvn != null) {
            mro = starPositions.find((mxe) => mxe.name == mvn.code);
          }
        }
        if (mro != null) {
          fur = mro.name;
          recenter(mro);
        } else {
          showMessage("Nothing found", 3000);
        }
        this.setValue("");
      });
      gui.add(params, "Info", ["None", "About", "Feedback"])
        .onChange(function (value) {
          switch (value) {
            case "None":
              if (params.Mode == EXPLORATORY_MODE) {
                showInfo();
              } else {
                showMessage(WELCOME_MESSAGE);
              }
              break;
            case "About":
              showMessage(ABOUT_MESSAGE);
              break;
            case "Feedback":
              showMessage(FEEDBACK_MESSAGE);
              break;
          }
        });
      var searchEl = document.querySelector(".c>input[type=text]");
      var myl = document
        .evaluate(
          "//li[div[span[text()='Show constellations']]]",
          document,
          null,
          XPathResult.ANY_TYPE,
          null
        )
        .iterateNext();
      myl.classList.add("hidden");
      var showDensity = document.evaluate("//li[div[span[text()='Show density']]]", document, null, XPathResult.ANY_TYPE, null).iterateNext();
      showDensity.classList.add("hidden");
      var search = document.evaluate("//li[div[span[text()='Search']]]", document, null, XPathResult.ANY_TYPE, null).iterateNext();
      search.classList.add("hidden");
      await ngy();
      await nlx();
      await oao();
      await rzk();
      StarAgent.init({ scene: scene, camera: camera, controls: controls, stars: starPositions, names: ghb });
      naj();
      function naj() {
        setTimeout(function () {
          requestAnimationFrame(naj);
        }, 15);
        wup();
      }
      
      function ncn(nfb) {
        for (let ndj of gfv) {
          for (let neb of ndj["types"]) {
            if (nfb.startsWith(neb)) {
              return ndj["rgb"];
            }
          }
        }
        console.warn("Cannot determine colour for spectral type: " + nfb);
        return [0.0, 0.9, 0.0];
      }
      
      function ngy() {
        fetch("./files/wub.txt")
          .then((res) => res.text())
          .then((text) => {
            for (let colour of text.split("\n")) {
              var nhv = colour.split("|"),
                niu = nhv[0].split(" "),
                njr = nhv[1].split(" "),
                nla = {};
              nla["types"] = niu;
              nla["rgb"] = njr;
              gfv.push(nla);
            }
          })
          .catch((e) => console.error(e));
      }
      
      function nlx() {
        fetch("./files/efs.txt")
          .then((res) => res.text())
          .then((text) => {
            for (let nnu of text.split("\n")) {
              var nne = nnu.split("|"),
                npi = {};
              npi.code = nne[0];
              npi.name = nne[1];
              ghb.push(npi);
            }
          })
          .catch((e) => console.error(e));
      }
      
      function oao() {
        fetch("./files/baz.txt")
          .then((res) => res.text())
          .then((text) => {
            for (let otg of text.split("\n")) {
              var obf = otg.split("|"),
                obr = obf[1].split(" "),
                ocu = obf[2],
                okn = obf[3].split(" "),
                omu = uwn(obf[0], 1.0, controls.target);
              omu.position.setFromSphericalCoords(ocu, obr[0], obr[1]);
              omu.apptype = APPTYPE.njy;
              omu.name = obf[0];
              omu.center = new THREE.Vector3();
              omu.center.setFromSphericalCoords(ocu, okn[0], okn[1]);
              var oph = new THREE.Vector3();
              oph.y = omu.position.y;
              omu.lookAt(oph);
              etu.push(...omu.children);
              gjm.push(omu);
            }
          })
          .catch((e) => console.error(e));
      }
      
      function oyi(event) {
        event.preventDefault();
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        ldg.setFromCamera(mouse, camera);
        var paj = ldg.intersectObjects(scene.children);
        if (paj.length > 0 && !dkk && paj[0].object.text != undefined) {
          var pca = paj[0].object;
          if (pca != fwk) {
            showState(pca.name);
          }
        } else {
          showState("");
        }
      }
      
      function showInfo(smooth) {
        if (params.Mode == "Free") {
          if (smooth) {
            showSmoothMessage(WELCOME_MESSAGE);
          } else {
            showMessage(WELCOME_MESSAGE);
          }
        } else {
          switch (progress) {
            case 0:
              if (smooth) {
                showSmoothMessage(CONS_STAGE + "(" + consLeft() + "/10 left)");
              } else {
                showMessage(CONS_STAGE + "(" + consLeft() + "/10 left)");
              }
              recenter(sun);
              showConstellations(true);
              break;
            case 1:
            case 2:
            case 3:
            case 4:
            case 5:
              showMessage(STARS_STAGE + STARS_INSTRUCTIONS[progress - 1]);
              break;
            case 6:
              showArrow(true);
            case 7:
            case 8:
            case 9:
            case 10:
              clustersStageActive = true;
              showMessage(CLUSTERS_STAGE + CLUSTERS_INSTRUCTIONS[progress - 6]);
              break;
            case 11:
              showArrow(false);
              clustersStageActive = false;
              search.classList.remove("hidden");
              showDensity.classList.remove("hidden");
              showSmoothMessage(MODE_COMPLETED);
          }
        }
      }
      
      function showArrow(show) {
        if (show) {
          var geometry = new THREE.CylinderBufferGeometry(0, 0.03, 0.15, 24);
          geometry.rotateX(Math.PI / 2);
          var material = new THREE.MeshBasicMaterial({ color: ffx });
          arrow = new THREE.Mesh(geometry, material);
          arrow.position.x = controls.target.x;
          arrow.position.y = controls.target.y + 0.5;
          arrow.position.z = controls.target.z;
          arrow.lookAt(gjm[progress - 6].center);
          scene.add(arrow);
        } else {
          scene.remove(arrow);
        }
      }
      
      function onDocumentMouseDown(event) {
        mouseDownX = event.clientX;
        mouseDownY = event.clientY;
        showState("");
      }
      
      async function onDocumentMouseUp(event) {
        if (!searchEl.contains(event.target)) {
          searchEl.blur();
        }
        event.preventDefault();
        var ppj = 0, pqo;
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        if (
          Math.abs(mouseDownX - event.clientX) > 5 ||
          Math.abs(mouseDownY - event.clientY) > 5
        ) {
          return;
        }
        ldg.setFromCamera(mouse, camera);
        var pry = ldg.intersectObjects(scene.children);
        var ptz =
          pry.length > 0 && pry.every((obj) => obj.object.apptype == APPTYPE.nrv);
        if (
          pry.length > 1 &&
          pry[0].object.position.distanceTo(camera.position) < 0.1
        ) {
          pqo = pry[1].object;
        }
        if (fhu && (pry.length == 0 || ptz)) {
          pry = ldg.intersectObjects(eqo);
        }
        if (clustersStageActive && pry.length == 0) {
          pry = ldg.intersectObjects(etu);
        }
        if (
          pry.length > 0 &&
          dkk == null &&
          (pry[0].object.apptype != undefined ||
            pry[0].object.parent.apptype != undefined)
        ) {
          if (pqo == undefined) {
            pqo = pry[0].object;
          }
          if (
            (pqo.position.distanceTo(camera.position) < 0.3 ||
              pqo.apptype == APPTYPE.nrv) &&
            pry.length > 1
          ) {
            for (var i = 1; i < pry.length; i++) {
              if (pqo.apptype == APPTYPE.nrv) {
                pqo = pry[i].object;
              } else {
                break;
              }
            }
          }
          if (
            pqo == undefined ||
            pqo.apptype == APPTYPE.nrv ||
            pqo.apptype == APPTYPE.BLACK_HOLE
          ) {
            return;
          }
          dzv = 0;
          if (pqo.type === "Line" && pqo.parent.apptype == APPTYPE.non && fhu) {
            pqo.material.color.setHex(fdn);
            if (fmq == null) {
              fmq = pqo.parent;
            } else {
              fnv = pqo.parent;
              await jyg(1000);
              if (fnv == fmq) {
                return;
              }
              if (fnv.conGroup != null && fnv.conGroup == fmq.conGroup) {
                showMessage(CONS_HIT);
                var pxy = (fnv.position.x + fmq.position.x) / 2,
                  pzt = (fnv.position.y + fmq.position.y) / 2,
                  qay = (fnv.position.z + fmq.position.z) / 2;
                const puv = new THREE.QuadraticBezierCurve3(
                  fnv.position,
                  new THREE.Vector3(
                    (3 * pxy) / 4,
                    (5 * pzt) / 4,
                    (3 * qay) / 4
                  ),
                  fmq.position
                );
                gdh = puv.getPoints(dly);
                const pwv = new THREE.QuadraticBezierCurve3(
                  fnv.position,
                  new THREE.Vector3(
                    (5 * pxy) / 4,
                    (3 * pzt) / 4,
                    (5 * qay) / 4
                  ),
                  fmq.position
                );
                geq = pwv.getPoints(dly);
                dkk = nax.myz;
              } else {
                if (fnv.conGroup != null || fmq.conGroup != null) {
                  showMessage(CONS_PART_MISS, 5000);
                } else {
                  showMessage(CONS_MISS, 5000);
                }
                fmq.children[0].material.color.setHex(fcg);
                fnv.children[0].material.color.setHex(fcg);
                fmq = undefined;
                fnv = undefined;
              }
            }
            return;
          }
          if (pqo.type === "Line" && pqo.parent.apptype == APPTYPE.njy && clustersStageActive) {
            if (
              pqo.parent.visited ||
              camera.position.distanceTo(pqo.parent.position) > his
            ) {
              return;
            }
            if (pqo.parent.name != CLUSTERS_TO_VISIT[progress - 6]) {
              return;
            }
            fld = params.showConstellations;
            showConstellations(false);
            dkk = nax.mxm;
            controls.enabled = false;
            scene.remove(arrow);
            pqo.material.color.setHex(fdn);
            pry = pry.filter((line) => line.object.parent.apptype == APPTYPE.njy);
            fzt = pry[0].object.parent;
            var qai = fzt.center;
            fzt.visited = true;
            var qco = new THREE.Vector3();
            qco.copy(qai);
            var qdu = Math.max(Math.abs(qco.x), Math.abs(qco.z));
            var qfh = (qdu - 30) / qdu;
            qco.x *= qfh;
            qco.y += dqx;
            qco.z *= qfh;
            var qhc = controls.target.x,
              qma = controls.target.y,
              qns = controls.target.z,
              qhx = qai.x,
              qtn = qai.y,
              qqs = qai.z,
              qjc = camera.position.x,
              qse = camera.position.y,
              qpl = camera.position.z,
              qjr = qco.x,
              quo = qco.y,
              qwi = qco.z;
            var qyg = 0.0;
            for (let i = 0; i < dly; i++) {
              inc[i] = (Math.PI * (qjr - qjc) * Math.sin(qyg)) / (2 * dly);
              iom[i] = (Math.PI * (quo - qse) * Math.sin(qyg)) / (2 * dly);
              iqp[i] = (Math.PI * (qwi - qpl) * Math.sin(qyg)) / (2 * dly);
              ist[i] = (Math.PI * (qhx - qhc) * Math.sin(qyg)) / (2 * dly);
              ivu[i] = (Math.PI * (qtn - qma) * Math.sin(qyg)) / (2 * dly);
              jay[i] = (Math.PI * (qqs - qns) * Math.sin(qyg)) / (2 * dly);
              qyg = qyg + dsx;
            }
            var rao = new THREE.Vector3();
            rao.copy(qco);
            rao.y -= dqx;
            var rco = rao.distanceTo(qai);
            qyg = Math.atan(qai.x / qai.z) + Math.PI / 2;
            var rei = Math.sign(qai.x),
              rgq = Math.sign(qai.z);
            for (let i = 0; i < dnw; i++) {
              jhw[i] = rgq * rei * rco * Math.cos(qyg);
              jmt[i] = -rgq * rco * Math.sin(qyg);
              qyg = qyg - dvr;
            }
            return;
          }
          recenter(pqo);
          wup();
        }
      }
      window.onresize = function () {
        var ria = window.innerWidth,
          rjn = window.innerHeight;
        camera.aspect = ria / rjn;
        camera.updateProjectionMatrix();
        renderer.setSize(ria, rjn);
        composer.setSize(ria, rjn);
        finalComposer.setSize(ria, rjn);
        wup();
      };
      
      function recenter(rxq) {
        StarAgent.notifyStarClick(rxq);
        var rny = controls.target.x,
          rqj = controls.target.y,
          rsp = controls.target.z,
          rop = rxq.position.x,
          rrl = rxq.position.y,
          rui = rxq.position.z;
        dkk = nax.mzz;
        if (fwk != undefined) {
          ush(fwk, false);
        }
        xvn(rxq.position, true);
        var rwg = 0.0;
        for (let i = 0; i < dly; i++) {
          ieq[i] = (Math.PI * (rop - rny) * Math.sin(rwg)) / (2 * dly);
          ihm[i] = (Math.PI * (rrl - rqj) * Math.sin(rwg)) / (2 * dly);
          iky[i] = (Math.PI * (rui - rsp) * Math.sin(rwg)) / (2 * dly);
          rwg = rwg + dsx;
        }
        if (
          camera.position.distanceTo(rxq.position) > 0.1 &&
          rxq.text != undefined
        ) {
          ush(rxq, true);
        }
        if (rxq.apptype == APPTYPE.STAR) {
          fwk = rxq;
        }
      }
      
      async function rzk() {
        scene.traverse(wtk);
        scene.children.length = 0;
        const sbe = new THREE.LineBasicMaterial({ color: ffx });
        vrj();
        var urls = [];
        for (var i = 1; i <= 12; i++) {
          urls.push("./files/ydf" + i + ".txt");
        }
        const requests = urls.map((url) => fetch(url));
        await Promise.all(requests)
          .then((responses) => {
            const text = responses.map((res) => res.text());
            return Promise.all(text);
          })
          .then((data) => {
            var allText = data.reduce((txt1, txt2) => {
              return txt1 + txt2;
            });
            var sdj = allText.split("\n"),
              sfd = new THREE.Vector3();
            for (let shn of sdj) {
              var sgf = {};
              sgf.name = shn.split("|")[0];
              sgf.data = shn;
              sgf.position = createPosition(shn);
              starPositions.push(sgf);
              if (sgf.position.distanceTo(sfd) < hbn || sxe(sgf.name)) {
                var sio = tko(shn);
                for (let sju of ecz) {
                  for (let skv of sju) {
                    if (skv.name === sio.name) {
                      skv.position = sio.position;
                    }
                  }
                }
                spheres.push(sio);
                if (hfy > controls.target.distanceTo(sio.position)) {
                  scene.add(sio);
                }
              }
            }
            for (let smc of ecz) {
              const snh = [];
              for (let sok of smc) {
                if (sok.position.x === undefined) {
                  console.warn(sok.name + " data is missing");
                }
                snh.push(sok.position);
              }
              edv.push(snh);
              var spd = new THREE.BufferGeometry().setFromPoints(snh);
              var sqj = new THREE.Line(spd, sbe);
              sqj.visible = false;
              sqj.shine = false;
              sqj.apptype = APPTYPE.nrv;
              lines.push(sqj);
              scene.add(sqj);
            }
            ush(fwk, true);
            StarVisuals.init({ scene: scene, camera: camera, controls: controls, stars: spheres });
          })
          .catch((e) => console.error(e));
        showInfo(true);
        ppp();
        showGalaxyCenter();
        wup();
      }
      
      function ppp() {
        var csz = 100.0,
          fto = 2000.0,
          mtr = new Array(40);
        for (let i = 0; i < 40; i++) {
          mtr[i] = new Array(40);
          for (let j = 0; j < 40; j++) {
            mtr[i][j] = new Array(40).fill(0);
          }
        }
        for (var jjj of starPositions) {
          if (jjj.position.distanceTo(sun.position) < fto) {
            var lll = Math.floor(jjj.position.x / csz) + 20;
            var gbp = Math.floor(jjj.position.y / csz) + 20;
            var xlp = Math.floor(jjj.position.z / csz) + 20;
            mtr[lll][gbp][xlp] += 1;
          }
        }
        for (let i = 0; i < 40; i++) {
          for (let j = 0; j < 40; j++) {
            for (let k = 0; k < 40; k++) {
              var pti = new THREE.Vector3();
              pti.x = (i - 20) * csz + csz / 2;
              pti.y = (j - 20) * csz + csz / 2;
              pti.z = (k - 20) * csz + csz / 2;
              var clr =
                mtr[i][j][k] > 2000
                  ? rde
                  : mtr[i][j][k] > 1500
                  ? org
                  : mtr[i][j][k] > 1000
                  ? yll
                  : fcg;
              if (mtr[i][j][k] != 0) {
                var utr = uwn(mtr[i][j][k] + "", 4.0, pti, clr);
                ttt.push(utr);
              }
            }
          }
        }
      }
      
      function showGalaxyCenter() {
        var sagAMaterial = new THREE.MeshBasicMaterial({ color: 0x100500 });
        var sagA = new THREE.Mesh(starGeometry, sagAMaterial);
        sagA.position.setFromSphericalCoords(26000, 2.07, 4.64);
        sagA.scale.setScalar(50.0);
        sagA.name = "Sagittarius A*";
        sagA.apptype = APPTYPE.BLACK_HOLE;
        scene.add(sagA);
      }
      
      function sxe(taq) {
        for (let syd of ecz) {
          for (let szp of syd) {
            if (szp.name === taq) {
              return true;
            }
          }
        }
        return false;
      }
      
      function createPosition(star) {
        var params = star.split("|"),
          ly = plxToLy(params[3]),
          coord = params[2].split(" "),
          fi = degreesToRad(coord[0]),
          theta = degreesToRad(coord[1]);
        return new THREE.Vector3().setFromSphericalCoords(ly, Math.PI / 2 - theta, fi);
      }
      
      function tko(tno) {
        var tmg = tno.split("|"),
          tpm = new THREE.Color(),
          trt = tmg[0],
          tts = tmg[4];
        tpm.setHex(ncn(tts));
        var tuv = new THREE.MeshBasicMaterial({ color: tpm }),
          twd = new THREE.Mesh(starGeometry, tuv),
          txk = plxToLy(tmg[3]);
        if (tmg[0] === "Sun") {
          txk = 0.0;
          sun = twd;
          fwk = twd;
        }
        var tzb = tmg[2].split(" "),
          uao = degreesToRad(tzb[0]),
          ubs = degreesToRad(tzb[1]);
        twd.position.setFromSphericalCoords(txk, Math.PI / 2 - ubs, uao);
        twd.name = trt;
        var ucx = ghb.find((ufu) => ufu.code == trt);
        if (ucx != null) {
          twd.secondName = ucx.name;
        }
        var uel = tmg[5];
        if (uel !== undefined && uel.length != 0) {
          if (uel.endsWith("km")) {
            uel = Number(uel.split(" ")[0] / SUN_DIAMETER);
          } else if (uel.endsWith("mas")) {
            uel = Number(uel.split(" ")[0]);
          } else {
            uel = "NA";
          }
        } else {
          uel = "NA";
        }
        if (uel == "NA") {
          twd.scale.setScalar(DEFAULT_RADIUS);
        } else {
          twd.scale.setScalar(DEFAULT_RADIUS * Math.pow(uel, 0.25));
        }
        twd.shine = true;
        twd.apptype = APPTYPE.STAR;
        twd.ijz = twd.scale.x;
        twd.text =
          txk.toFixed(0) +
          " ly. Type " +
          tmg[1] +
          " Class " +
          tts +
          (typeof uel == "number" && uel.toFixed(0) > 1
            ? ". " + uel.toFixed(0) + " Sun radii"
            : "");
        if (twd == sun) {
          twd.text = "Class " + tts;
        }
        return twd;
      }
      
      async function showSmoothMessage(uiu) {
        fsu = uiu;
        for (var i = 0; i <= uiu.length; i++) {
          kkj.innerText = uiu.substring(0, i);
          await jyg(huq);
          if (uiu != fsu) {
            break;
          }
        }
      }
      
      async function showMessage(uls, umt) {
        if (!klv) {
          koj = kkj.innerText;
        }
        kkj.innerText = uls;
        if (umt) {
          klv = true;
          await jyg(umt);
          kkj.innerText = koj;
          klv = false;
        }
      }
      
      function showState(uqn) {
        kjd.innerText = uqn;
      }
      
      function ush(utj, uvc) {
        if (!uvc) {
          scene.remove(utj.labelPrimary);
          scene.remove(utj.labelSecondary);
        } else {
          if (utj.apptype != APPTYPE.BLACK_HOLE) {
            var position = new THREE.Vector3(
              utj.position.x + 3 * utj.ijz,
              utj.position.y,
              utj.position.z
            );
            var name =
              utj.secondName != undefined
                ? utj.secondName + " (" + utj.name + ")"
                : utj.name;
            utj.labelPrimary = uwn(name, 0.02, position);
            scene.add(utj.labelPrimary);
            position.y -= 0.015;
            utj.labelSecondary = uwn(utj.text, 0.005, position);
            scene.add(utj.labelSecondary);
          }
        }
      }
      
      function uwn(uya, uzf, vaw, ujm) {
        var mww = ujm == undefined ? fcg : ujm;
        var vbq = new THREE.LineBasicMaterial({
          color: mww,
          side: THREE.DoubleSide,
        });
        var vci = jvo.generateShapes(uya, uzf);
        var vdg = [];
        for (var i = 0; i < vci.length; i++) {
          var vil = vci[i];
          if (vil.holes && vil.holes.length > 0) {
            for (var j = 0; j < vil.holes.length; j++) {
              var hole = vil.holes[j];
              vdg.push(hole);
            }
          }
        }
        vci.push.apply(vci, vdg);
        var label = new THREE.Object3D();
        for (var i = 0; i < vci.length; i++) {
          var vil = vci[i],
            vjp = vil.getPoints(),
            vke = new THREE.BufferGeometry().setFromPoints(vjp),
            vlf = new THREE.Line(vke, vbq);
          label.add(vlf);
        }
        label.position.copy(vaw);
        return label;
      }
      
      function vrj() {
        fetch("./files/guz.txt")
          .then((res) => res.text())
          .then((text) => {
            for (let vst of text.split("\n")) {
              var vtt = [];
              for (let vux of vst.split("|")) {
                var vwq = {};
                vwq.name = vux;
                vwq.position = {};
                vtt.push(vwq);
              }
              ecz.push(vtt);
            }
          })
          .catch((e) => console.error(e));
        fetch("./files/psu.txt")
          .then((res) => res.text())
          .then((text) => {
            var vxv = [];
            for (let vyv of text.split("\n")) {
              var wap = vyv.split("|");
              var coord = wap[1].split(" "),
                wbt = uwn(wap[0], 0.4, controls.target);
              wbt.position.setFromSphericalCoords(30, coord[0], coord[1]);
              wbt.visible = false;
              wbt.apptype = APPTYPE.non;
              wbt.conGroup = wap[2];
              wbt.conName = wap[0];
              wbt.lookAt(controls.target);
              if (wbt.conGroup) {
                vxv.push(wbt);
              }
              eqo.push(...wbt.children);
              constellationNames.push(wbt);
              scene.add(wbt);
            }
            while (vxv.length > 0) {
              var wcz = vxv[0];
              for (let wef of vxv) {
                if (wcz != wef && wcz.conGroup == wef.conGroup) {
                  swapConsOnInit(wcz, wef);
                  vxv = vxv.filter((label) => label.conGroup != wcz.conGroup);
                }
              }
            }
          })
          .catch((e) => console.error(e));
      }
      
      function swapConsOnInit(first, second) {
        var position = first.position.clone();
        first.position.copy(second.position);
        second.position.copy(position);
        first.lookAt(0.0, 0.0, 0.0);
        second.lookAt(0.0, 0.0, 0.0);
      }
      
      function plxToLy(plx) {
        return 3261.56 / plx;
      }
      
      function degreesToRad(degrees) {
        return (degrees * Math.PI) / 180.0;
      }
      
      function wtk(obj) {
        if (obj.material) {
          obj.material.dispose();
        }
      }
      
      function wup() {
        StarVisuals.update();
        if (dkk == nax.mzz) {
          var wvv = ieq[dzv],
            wxb = ihm[dzv],
            wyd = iky[dzv];
          dzv++;
          var wzz = new THREE.Vector3(wvv, wxb, wyd);
          camera.position.add(wzz);
          controls.target.add(wzz);
          camera.lookAt(controls.target);
          if (arrow != undefined && scene.children.includes(arrow)) {
            arrow.position.add(wzz);
            arrow.lookAt(gjm[progress - 6].center);
          }
          if (dzv >= dly) {
            dkk = null;
            xvn(fwk.position, false);
            clearScene();
            dzv = 0;
            if (params.Mode == EXPLORATORY_MODE && fwk.name == STARS_TO_VISIT[progress - 1]) {
              showSmoothMessage("Well done! " + STARS_INFO[progress - 1]);
              var xkk = new Audio("./files/paz.mp3");
              xkk.volume = 0.5;
              xkk.play();
              setTimeout(() => {
                progress++;
                showInfo();
              }, 15000);
            }
          }
        }
        if (dkk == nax.myz) {
          fmq.position.copy(gdh[dly - dzv]);
          fnv.position.copy(geq[dzv]);
          dzv++;
          fmq.lookAt(sun.position);
          fnv.lookAt(sun.position);
          if (dzv >= dly) {
            dkk = null;
            fmq.children[0].material.color.setHex(fcg);
            fnv.children[0].material.color.setHex(fcg);
            fnv.conGroup = null;
            fmq.conGroup = null;
            fmq = null;
            fnv = null;
            var xbe = consLeft();
            if (xbe > 0) {
              showMessage(CONS_STAGE + "(" + xbe + "/10) left");
            } else {
              showMessage(CONS_COMPLETED);
              myl.classList.remove("hidden");
              fhu = false;
              myl.click();
              progress++;
              setTimeout(() => {
                showInfo();
              }, 10000);
            }
          }
        }
        if (dkk == nax.mxm) {
          if (fwk != undefined) {
            ush(fwk, false);
          }
          var xcd = inc[dzv],
            xdw = iom[dzv],
            xfs = iqp[dzv],
            xcw = ist[dzv],
            xen = ivu[dzv],
            xgj = jay[dzv];
          dzv++;
          var xhr = new THREE.Vector3(xcd, xdw, xfs),
            xiv = new THREE.Vector3(xcw, xen, xgj);
          camera.position.add(xhr);
          controls.target.add(xiv);
          camera.lookAt(controls.target);
          if (dzv >= dly) {
            dkk = nax.muc;
            dzv = 0;
            var xkk = new Audio("./files/ekm.mp3");
            xkk.volume = 0.5;
            xkk.play();
            if (params.Mode == EXPLORATORY_MODE && fzt.name == CLUSTERS_TO_VISIT[progress - 6]) {
              showSmoothMessage("Well done! " + CLUSTERS_INFO[progress - 6]);
              setTimeout(() => {
                progress++;
                showInfo();
              }, 26000);
            }
          }
        }
        if (dkk == nax.muc) {
          var xcd = jhw[dzv] - jhw[dzv - 1];
          var xfs = jmt[dzv] - jmt[dzv - 1];
          dzv++;
          var xhr = new THREE.Vector3(xcd, 0.0, xfs);
          camera.position.add(xhr);
          camera.lookAt(controls.target);
          if (dzv >= dnw) {
            scene.add(arrow);
            arrow.position.x = controls.target.x;
            arrow.position.y = controls.target.y + 0.5;
            arrow.position.z = controls.target.z;
            arrow.lookAt(gjm[progress - 6].center);
            controls.enabled = true;
            dkk = null;
            dzv = 0;
            showConstellations(fld);
          }
        }
        adjustStars();
        ybu();
        finalComposer.render();
      }
      
      function adjustStars() {
        for (var obj of scene.children) {
          if (obj.apptype == APPTYPE.STAR) {
            var distance = obj.position.distanceTo(camera.position);
            var red = obj.material.color.g == 0.0 && obj.material.color.b == 0.0;
            var kuq = Math.sqrt(2 * distance) / 3;
            if (distance > hfy && obj.ijz != DEFAULT_RADIUS) {
              continue;
            }
            if ((kuq < 1 && kuq > 0.5) || (!red && kuq > 1)) {
              obj.scale.setScalar(kuq * obj.ijz);
            }
          }
        }
      }
      
      function clearScene() {
        for (var sphere of scene.children.filter((obj) => obj.apptype == APPTYPE.STAR && !spheres.includes(obj))) {
          scene.remove(sphere);
        }
      }
      
      function recalculateCache(position) {
        spheres = [];
        for (var xst of starPositions) {
          if (xst.position.distanceTo(position) < hbn) {
            var xtt = tko(xst.data);
            spheres.push(xtt);
          }
        }
        hcz.copy(position);
      }
      
      function xvn(xwl, xxu) {
        if (hcz.distanceTo(xwl) > hbn / 2) {
          recalculateCache(xwl);
        }
        for (var xzp of spheres) {
          if (xxu && xzp.position.distanceTo(xwl) < hfy) {
            scene.add(xzp);
            if (xzp.name == fur) {
              fwk = xzp;
              ush(xzp, true);
              fur = undefined;
            }
          }
          if (!xxu && xzp.position.distanceTo(xwl) > hfy) {
            scene.remove(xzp);
          }
        }
        for (var gnv of ttt) {
          if (xxu && params.showDensity && gnv.position.distanceTo(xwl) < 500) {
            scene.add(gnv);
          }
          if (!xxu && gnv.position.distanceTo(xwl) > 500) {
            scene.remove(gnv);
          }
        }
        for (var yar of gjm) {
          if (his > xwl.distanceTo(yar.position)) {
            scene.add(yar);
          } else {
            scene.remove(yar);
          }
        }
        console.log("Scene objects " + scene.children.length);
      }
      
      function ybu() {
        scene.traverse(ycr);
        composer.render();
        scene.traverse(ydo);
      }
      
      function ycr(ybg) {
        if (!ybg.shine) {
          khm[ybg.uuid] = ybg.material;
          ybg.material = khb;
        }
      }
      
      function ydo(yay) {
        if (khm[yay.uuid]) {
          yay.material = khm[yay.uuid];
          delete khm[yay.uuid];
        }
      }
    </script>
